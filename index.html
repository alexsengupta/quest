<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planetary Energy Balance (VR)</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script>
// ===================== MODEL (no graphics) =====================
// Zero-dimensional energy balance with an optional single-layer grey atmosphere.
//   Surface:     Cs dTs/dt = (1-a) S0/4 + eps*sigma*Ta^4 - sigma*Ts^4
//   Atmosphere:  Ca dTa/dt = eps*sigma*Ts^4 - 2*eps*sigma*Ta^4
// With no atmosphere the surface simply radiates sigma*Ts^4 straight to space.
// Equilibrium: Ts = Te * (2/(2-eps))^(1/4), with Te = ((1-a) S0 / (4 sigma))^(1/4)
const SIGMA = 5.670374e-8;      // Stefan-Boltzmann constant (W m-2 K-4)
const YEAR = 3.156e7;           // seconds per year
const WINDOW = 40;              // model years shown on the time-series plot

const DEFAULTS = { S0: 1361, albedo: 0.30, eps: 0.78, speed: 1.0,
                   atmosphere: true, iceFeedback: false, paused: false };

const SIM = {
  params: Object.assign({}, DEFAULTS),
  Ts: 288, Ta: 242, year: 0, lastSample: 0, history: [],
  Cs: 2.9e8,   // ~70 m ocean mixed layer (J m-2 K-1)
  Ca: 1.0e7,   // atmospheric column, cp * p / g (J m-2 K-1)
  f: {}
};

function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }

// Ice edge latitude (degrees) as a simple function of surface temperature.
// Present day (15 C) -> 72 deg; ice reaches the equator at -25 C; no ice above 30 C.
function iceEdgeLat(Ts) {
  if (Ts >= 288) return Math.min(90, 72 + (Ts - 288) * 1.2);
  return Math.max(0, 72 - (288 - Ts) * 1.8);
}
// Fraction of the sphere's area poleward of the ice edge (both hemispheres)
function iceFraction(latDeg) { return 1 - Math.sin(latDeg * Math.PI / 180); }
const F_ICE_REF = iceFraction(72);

// With feedback on, the albedo slider sets the present-day value and ice cover adds to it
function effectiveAlbedo(Ts) {
  const p = SIM.params;
  if (!p.iceFeedback) return p.albedo;
  return clamp(p.albedo + 0.35 * (iceFraction(iceEdgeLat(Ts)) - F_ICE_REF), 0, 0.9);
}

function equilibriumTs() {
  const p = SIM.params;
  const a = effectiveAlbedo(SIM.Ts);
  const Te = Math.pow((1 - a) * p.S0 / 4 / SIGMA, 0.25);
  return p.atmosphere ? Te * Math.pow(2 / (2 - p.eps), 0.25) : Te;
}

function stepModel(dtYears) {
  const p = SIM.params;
  const n = Math.max(1, Math.ceil(dtYears / 0.004));   // substeps keep explicit Euler stable
  const dt = dtYears / n * YEAR;
  for (let i = 0; i < n; i++) {
    const absorbed = (1 - effectiveAlbedo(SIM.Ts)) * p.S0 / 4;
    const up = SIGMA * Math.pow(SIM.Ts, 4);
    if (p.atmosphere) {
      const atm = p.eps * SIGMA * Math.pow(SIM.Ta, 4);
      const dTs = (absorbed + atm - up) / SIM.Cs;
      const dTa = (p.eps * up - 2 * atm) / SIM.Ca;
      SIM.Ts += dTs * dt;
      SIM.Ta += dTa * dt;
    } else {
      SIM.Ts += (absorbed - up) / SIM.Cs * dt;
    }
    SIM.Ts = Math.max(SIM.Ts, 3);
    SIM.Ta = Math.max(SIM.Ta, 3);
  }
  SIM.year += dtYears;
  if (SIM.year - SIM.lastSample >= 0.05) {
    SIM.history.push([SIM.year, SIM.Ts]);
    SIM.lastSample = SIM.year;
    while (SIM.history.length && SIM.history[0][0] < SIM.year - WINDOW) SIM.history.shift();
  }
}

function computeFluxes() {
  const p = SIM.params, f = SIM.f;
  f.a = effectiveAlbedo(SIM.Ts);
  f.Q = p.S0 / 4;
  f.reflected = f.a * f.Q;
  f.absorbed = f.Q - f.reflected;
  f.surfIR = SIGMA * Math.pow(SIM.Ts, 4);
  if (p.atmosphere) {
    f.atmAbs = p.eps * f.surfIR;
    f.back = p.eps * SIGMA * Math.pow(SIM.Ta, 4);
    f.atmUp = f.back;
    f.olr = (1 - p.eps) * f.surfIR + f.atmUp;
  } else {
    f.atmAbs = 0; f.back = 0; f.atmUp = 0; f.olr = f.surfIR;
  }
  f.imbalance = f.absorbed - f.olr;
}

function resetSim() {
  Object.assign(SIM.params, DEFAULTS);
  SIM.Ts = equilibriumTs();
  SIM.Ta = SIM.Ts * Math.pow(2, -0.25);
  SIM.year = 0; SIM.lastSample = 0; SIM.history = [];
  computeFluxes();
}

function setAtmosphere(on) {
  SIM.params.atmosphere = on;
  if (on) SIM.Ta = SIM.Ts * Math.pow(2, -0.25);   // atmosphere starts in balance with the surface
}

resetSim();

// ===================== GRAPHICS AND INTERFACE =====================
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
const COL = {
  sun: '#ffe066', reflected: '#fff4cc', surfIR: '#ff7a33', atmIR: '#ff4fa0',
  atmos: '#8cc8ff', text: '#e8eef6', muted: '#8fa3bf', panel: '#0d1726'
};

// A flat plane carrying a 2D canvas, used for all text in the scene
function makeCanvasPlane(widthM, pxW, pxH) {
  const canvas = document.createElement('canvas');
  canvas.width = pxW; canvas.height = pxH;
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(widthM, widthM * pxH / pxW), mat);
  return { canvas, ctx, tex, mesh, mat };
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}

function tempColor(c) {
  const stops = [[-40, [124, 196, 255]], [0, [207, 233, 255]], [15, [255, 255, 255]],
                 [30, [255, 192, 120]], [60, [255, 107, 74]]];
  if (c <= stops[0][0]) return 'rgb(' + stops[0][1].join(',') + ')';
  for (let i = 1; i < stops.length; i++) {
    if (c <= stops[i][0]) {
      const t = (c - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]);
      const a = stops[i - 1][1], b = stops[i][1];
      return 'rgb(' + a.map((v, k) => Math.round(v + (b[k] - v) * t)).join(',') + ')';
    }
  }
  return 'rgb(' + stops[stops.length - 1][1].join(',') + ')';
}

// ---------- Procedural Earth texture (no image files needed) ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildEarthTexture() {
  const W = 1024, H = 512;
  const rnd = mulberry32(11);
  const pp = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pp[i], pp[j]] = [pp[j], pp[i]]; }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = pp[i & 255];
  const hash = (x, y, z) => perm[(perm[(perm[x & 255] + y) & 255] + z) & 255] / 255;
  const L = (a, b, t) => a + (b - a) * t;
  function vnoise(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    let xf = x - xi, yf = y - yi, zf = z - zi;
    xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf); zf = zf * zf * (3 - 2 * zf);
    return L(L(L(hash(xi, yi, zi), hash(xi + 1, yi, zi), xf), L(hash(xi, yi + 1, zi), hash(xi + 1, yi + 1, zi), xf), yf),
             L(L(hash(xi, yi, zi + 1), hash(xi + 1, yi, zi + 1), xf), L(hash(xi, yi + 1, zi + 1), hash(xi + 1, yi + 1, zi + 1), xf), yf), zf);
  }
  function fbm(x, y, z) {
    let s = 0, a = 0.5, f = 1;
    for (let o = 0; o < 5; o++) { s += a * vnoise(x * f, y * f, z * f); f *= 2.03; a *= 0.5; }
    return s;
  }
  const h = new Float32Array(W * H), latRow = new Float32Array(H);
  for (let j = 0; j < H; j++) {
    const lat = 90 - (j + 0.5) / H * 180; latRow[j] = lat;
    const lr = lat * Math.PI / 180, cl = Math.cos(lr), sl = Math.sin(lr);
    for (let i = 0; i < W; i++) {
      const lon = (i + 0.5) / W * 2 * Math.PI;
      h[j * W + i] = fbm(cl * Math.cos(lon) * 1.8 + 3.1, sl * 1.8 + 1.3, cl * Math.sin(lon) * 1.8 + 7.7);
    }
  }
  const sorted = Float32Array.from(h).sort();
  const thr = sorted[Math.floor(0.70 * sorted.length)];      // ~30% land
  const hMax = sorted[Math.floor(0.999 * sorted.length)];
  const hMin = sorted[Math.floor(0.001 * sorted.length)];
  const base = new Uint8ClampedArray(W * H * 4), isLand = new Uint8Array(W * H);
  const mix = (a, b, t) => [L(a[0], b[0], t), L(a[1], b[1], t), L(a[2], b[2], t)];
  for (let j = 0; j < H; j++) {
    const al = Math.abs(latRow[j]);
    const dry = clamp(1 - Math.abs(al - 25) / 12, 0, 1) * 0.55;   // subtropical deserts
    for (let i = 0; i < W; i++) {
      const k = j * W + i, v = h[k];
      let c;
      if (v < thr) {
        c = mix([10, 47, 92], [38, 118, 182], clamp((v - hMin) / (thr - hMin), 0, 1) ** 2);
      } else {
        isLand[k] = 1;
        const e = clamp((v - thr) / (hMax - thr), 0, 1);
        c = e < 0.5 ? mix([66, 122, 58], [128, 128, 72], e * 2) : mix([128, 128, 72], [150, 120, 92], (e - 0.5) * 2);
        c = mix(c, [201, 178, 122], dry);
      }
      base[k * 4] = c[0]; base[k * 4 + 1] = c[1]; base[k * 4 + 2] = c[2]; base[k * 4 + 3] = 255;
    }
  }
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(W, H);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return { W, H, base, isLand, latRow, ctx, img, tex };
}

function drawIce(E, edge) {
  const { W, H, base, isLand, latRow, img, ctx, tex } = E, d = img.data;
  for (let j = 0; j < H; j++) {
    const al = Math.abs(latRow[j]);
    let t = edge >= 89.5 ? 0 : clamp((al - (edge - 3)) / 3, 0, 1);
    t = t * t * (3 - 2 * t);
    for (let i = 0; i < W; i++) {
      const k = j * W + i, q = k * 4;
      if (t === 0) { d[q] = base[q]; d[q + 1] = base[q + 1]; d[q + 2] = base[q + 2]; d[q + 3] = 255; continue; }
      const ice = isLand[k] ? [244, 248, 252] : [218, 232, 243];
      d[q] = base[q] + (ice[0] - base[q]) * t;
      d[q + 1] = base[q + 1] + (ice[1] - base[q + 1]) * t;
      d[q + 2] = base[q + 2] + (ice[2] - base[q + 2]) * t;
      d[q + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  tex.needsUpdate = true;
}

// ---------- Runs the model every frame ----------
AFRAME.registerComponent('sim-runner', {
  tick: function (t, dt) {
    if (!dt) return;
    const s = Math.min(dt / 1000, 0.1);
    if (!SIM.params.paused) stepModel(s * SIM.params.speed);
    computeFluxes();
  }
});

// ---------- Starfield ----------
AFRAME.registerComponent('star-field', {
  init: function () {
    const N = 2500, pos = new Float32Array(N * 3), rnd = mulberry32(3);
    for (let i = 0; i < N; i++) {
      const z = 2 * rnd() - 1, ph = 2 * Math.PI * rnd(), r = Math.sqrt(1 - z * z);
      pos[i * 3] = 60 * r * Math.cos(ph); pos[i * 3 + 1] = 60 * z; pos[i * 3 + 2] = 60 * r * Math.sin(ph);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const m = new THREE.PointsMaterial({ color: 0xcfd8ff, size: 2, sizeAttenuation: false });
    this.el.object3D.add(new THREE.Points(g, m));
  }
});

// ---------- Earth, Sun, atmosphere and flux particles ----------
AFRAME.registerComponent('planet-system', {
  init: function () {
    const R = 0.6, RA = 0.78, SUN = 2.7;
    this.R = R; this.RA = RA; this.RMAX = 2.3; this.X0 = SUN - 0.42;
    this.VSW = 1.3; this.VIR = 0.55; this.K = 0.35;   // speeds (m/s); particles per second per W/m2
    const g = this.el.object3D;

    // Earth (tilted axis, slowly spinning)
    this.tilt = new THREE.Group();
    this.tilt.rotation.z = THREE.MathUtils.degToRad(23.4);
    g.add(this.tilt);
    this.E = buildEarthTexture();
    this.lastEdge = -1;
    this.earth = new THREE.Mesh(new THREE.SphereGeometry(R, 64, 48),
      new THREE.MeshStandardMaterial({ map: this.E.tex, roughness: 0.85, metalness: 0 }));
    this.tilt.add(this.earth);

    // Atmosphere: a glowing shell whose strength follows the emissivity
    this.shellMat = new THREE.ShaderMaterial({
      uniforms: { color: { value: new THREE.Color(COL.atmos) }, strength: { value: 1 } },
      vertexShader: `varying vec3 vN; varying vec3 vV;
        void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0);
          vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz);
          gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `uniform vec3 color; uniform float strength; varying vec3 vN; varying vec3 vV;
        void main(){ float f = 1.0 - max(dot(normalize(vN), normalize(vV)), 0.0);
          float a = (0.05 + pow(f, 2.5)) * strength;
          gl_FragColor = vec4(color, a);
          #include <colorspace_fragment>
        }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    this.shell = new THREE.Mesh(new THREE.SphereGeometry(RA, 64, 48), this.shellMat);
    g.add(this.shell);

    // Sun with a soft glow
    const sun = new THREE.Mesh(new THREE.SphereGeometry(0.32, 32, 24), new THREE.MeshBasicMaterial({ color: 0xffd75e }));
    sun.position.set(-SUN, 0, 0); g.add(sun);
    const gc = document.createElement('canvas'); gc.width = gc.height = 256;
    const gx = gc.getContext('2d'), grad = gx.createRadialGradient(128, 128, 0, 128, 128, 128);
    grad.addColorStop(0, 'rgba(255,230,150,1)'); grad.addColorStop(0.25, 'rgba(255,200,90,0.55)');
    grad.addColorStop(1, 'rgba(255,170,60,0)');
    gx.fillStyle = grad; gx.fillRect(0, 0, 256, 256);
    const gt = new THREE.CanvasTexture(gc); gt.colorSpace = THREE.SRGBColorSpace;
    this.glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: gt, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    this.glow.position.copy(sun.position); g.add(this.glow);

    // Sunlight beam: a cylinder exactly as wide as the Earth (the intercepting disc)
    const len = SUN - 0.32;
    this.beamMat = new THREE.MeshBasicMaterial({ color: 0xffe9a0, transparent: true, opacity: 0.05,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(R, R, len, 64, 1, true), this.beamMat);
    beam.rotation.z = Math.PI / 2; beam.position.x = -len / 2; g.add(beam);

    // Sunlight on the Earth
    const light = new THREE.DirectionalLight(0xffffff, 3.2);
    light.position.set(-SUN, 0, 0); g.add(light); g.add(light.target);

    // Flux particles: one instanced mesh of short glowing streaks
    const MAX = 3000; this.MAX = MAX;
    this.px = new Float32Array(MAX); this.py = new Float32Array(MAX); this.pz = new Float32Array(MAX);
    this.vx = new Float32Array(MAX); this.vy = new Float32Array(MAX); this.vz = new Float32Array(MAX);
    this.ty = new Uint8Array(MAX); this.n = 0; this.acc = [0, 0, 0, 0, 0];
    const pmat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95,
      blending: THREE.AdditiveBlending, depthWrite: false });
    this.pmesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.0065, 0.0065, 0.075, 5), pmat, MAX);
    this.pmesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.pmesh.frustumCulled = false;
    const white = new THREE.Color(1, 1, 1);
    for (let i = 0; i < MAX; i++) this.pmesh.setColorAt(i, white);
    this.pmesh.count = 0;
    g.add(this.pmesh);
    // particle types: 0 incoming sunlight, 1 reflected sunlight, 2 surface IR, 3 atmospheric IR up, 4 back-radiation
    this.cols = [COL.sun, COL.reflected, COL.surfIR, COL.atmIR, COL.atmIR].map(c => new THREE.Color(c));
    this.m = new THREE.Matrix4(); this.q = new THREE.Quaternion(); this.v3 = new THREE.Vector3();
    this.p3 = new THREE.Vector3(); this.s3 = new THREE.Vector3(); this.UP = new THREE.Vector3(0, 1, 0);
  },

  spawn: function (t, x, y, z, vx, vy, vz) {
    if (this.n >= this.MAX) return;
    const i = this.n++;
    this.px[i] = x; this.py[i] = y; this.pz[i] = z;
    this.vx[i] = vx; this.vy[i] = vy; this.vz[i] = vz; this.ty[i] = t;
  },
  remove: function (i) {
    const j = --this.n;
    this.px[i] = this.px[j]; this.py[i] = this.py[j]; this.pz[i] = this.pz[j];
    this.vx[i] = this.vx[j]; this.vy[i] = this.vy[j]; this.vz[i] = this.vz[j]; this.ty[i] = this.ty[j];
  },
  randUnit: function () {
    const z = 2 * Math.random() - 1, ph = 2 * Math.PI * Math.random(), r = Math.sqrt(1 - z * z);
    return [r * Math.cos(ph), z, r * Math.sin(ph)];
  },

  tick: function (time, dtMs) {
    if (!dtMs) return;
    const dt = Math.min(dtMs / 1000, 0.05), p = SIM.params, f = SIM.f;
    const R = this.R, RA = this.RA, RMAX = this.RMAX;

    this.earth.rotation.y += dt * 0.1;
    const edge = iceEdgeLat(SIM.Ts);
    if (Math.abs(edge - this.lastEdge) > 0.4) { drawIce(this.E, edge); this.lastEdge = edge; }
    this.shell.visible = p.atmosphere;
    this.shellMat.uniforms.strength.value = 0.15 + 1.1 * p.eps;
    const sRel = p.S0 / 1361;
    this.glow.scale.setScalar(2.3 * Math.sqrt(sRel));
    this.beamMat.opacity = 0.05 * sRel;

    // Spawn particles at rates proportional to each flux
    const rates = [this.K * f.Q, 0, this.K * f.surfIR,
                   p.atmosphere ? this.K * f.atmUp : 0, p.atmosphere ? this.K * f.back : 0];
    for (const k of [0, 2, 3, 4]) {
      this.acc[k] += rates[k] * dt;
      while (this.acc[k] >= 1) {
        this.acc[k] -= 1;
        if (k === 0) {
          const r = R * 0.97 * Math.sqrt(Math.random()), th = 2 * Math.PI * Math.random();
          this.spawn(0, -this.X0, r * Math.cos(th), r * Math.sin(th), this.VSW, 0, 0);
        } else {
          const u = this.randUnit(), rr = k === 2 ? R * 1.01 : RA * (k === 4 ? 0.995 : 1.0);
          const sgn = k === 4 ? -1 : 1;
          this.spawn(k, u[0] * rr, u[1] * rr, u[2] * rr, sgn * u[0] * this.VIR, sgn * u[1] * this.VIR, sgn * u[2] * this.VIR);
        }
      }
    }

    // Move particles and apply reflection / absorption
    for (let i = this.n - 1; i >= 0; i--) {
      const t = this.ty[i];
      let x = this.px[i], y = this.py[i], z = this.pz[i];
      const r0 = Math.hypot(x, y, z);
      x += this.vx[i] * dt; y += this.vy[i] * dt; z += this.vz[i] * dt;
      const r = Math.hypot(x, y, z);
      if (t === 0) {
        if (r <= R) {
          if (Math.random() < f.a) {                 // reflected: bounce off with some scatter
            const nx = x / r, ny = y / r, nz = z / r;
            const d = this.vx[i] * nx + this.vy[i] * ny + this.vz[i] * nz;
            let rx = this.vx[i] - 2 * d * nx + 0.6 * this.VSW * nx + 0.4 * this.VSW * (Math.random() - 0.5);
            let ry = this.vy[i] - 2 * d * ny + 0.6 * this.VSW * ny + 0.4 * this.VSW * (Math.random() - 0.5);
            let rz = this.vz[i] - 2 * d * nz + 0.6 * this.VSW * nz + 0.4 * this.VSW * (Math.random() - 0.5);
            const s = this.VSW / Math.hypot(rx, ry, rz);
            this.vx[i] = rx * s; this.vy[i] = ry * s; this.vz[i] = rz * s;
            x = nx * R * 1.003; y = ny * R * 1.003; z = nz * R * 1.003;
            this.ty[i] = 1;
          } else { this.remove(i); continue; }      // absorbed at the surface
        } else if (x > R) { this.remove(i); continue; }
      } else if (t === 2) {
        if (p.atmosphere && r0 < RA && r >= RA && Math.random() < p.eps) { this.remove(i); continue; }
        if (r > RMAX) { this.remove(i); continue; }
      } else if (t === 1 || t === 3) {
        if (r > RMAX) { this.remove(i); continue; }
      } else if (t === 4) {
        if (r <= R) { this.remove(i); continue; }
      }
      this.px[i] = x; this.py[i] = y; this.pz[i] = z;
    }

    // Write instance transforms and colours
    for (let i = 0; i < this.n; i++) {
      const t = this.ty[i], x = this.px[i], y = this.py[i], z = this.pz[i];
      this.v3.set(this.vx[i], this.vy[i], this.vz[i]).normalize();
      this.q.setFromUnitVectors(this.UP, this.v3);
      let s = 1;
      if (t === 1 || t === 2 || t === 3) s = clamp((RMAX - Math.hypot(x, y, z)) / 0.5, 0, 1);
      this.m.compose(this.p3.set(x, y, z), this.q, this.s3.set(s, s, s));
      this.pmesh.setMatrixAt(i, this.m);
      this.pmesh.setColorAt(i, this.cols[t]);
    }
    this.pmesh.count = this.n;
    this.pmesh.instanceMatrix.needsUpdate = true;
    if (this.pmesh.instanceColor) this.pmesh.instanceColor.needsUpdate = true;
  }
});

// ---------- Floating text labels that face the viewer ----------
AFRAME.registerComponent('world-label', {
  schema: { text: { type: 'string' }, color: { type: 'string', default: '#ffffff' },
            width: { type: 'number', default: 1 }, showIf: { type: 'string', default: '' } },
  init: function () {
    const d = this.data, c = makeCanvasPlane(d.width, 1024, 96);
    const ctx = c.ctx;
    let size = 46;
    ctx.font = `600 ${size}px ${FONT}`;
    while (ctx.measureText(d.text).width > 1000 && size > 20) { size -= 2; ctx.font = `600 ${size}px ${FONT}`; }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 10;
    ctx.fillStyle = d.color; ctx.fillText(d.text, 512, 50);
    c.tex.needsUpdate = true;
    this.el.object3D.add(c.mesh);
    const pos = this.el.object3D.position;
    this.el.object3D.rotation.y = Math.atan2(-pos.x, -pos.z);
  },
  tick: function () {
    if (this.data.showIf) this.el.object3D.visible = !!SIM.params[this.data.showIf];
  }
});

// ---------- Readout display: temperature, fluxes and time series ----------
AFRAME.registerComponent('info-display', {
  init: function () {
    this.c = makeCanvasPlane(0.72, 1024, 768);
    this.el.object3D.add(this.c.mesh);
    this.last = 0;
  },
  tick: function (t) {
    if (t - this.last < 100) return;      // redraw 10 times per second
    this.last = t;
    this.draw();
  },
  draw: function () {
    const c = this.c.ctx, p = SIM.params, f = SIM.f, W = 1024;
    c.clearRect(0, 0, 1024, 768);
    c.fillStyle = COL.panel; roundRect(c, 0, 0, 1024, 768, 28); c.fill();
    c.textBaseline = 'alphabetic'; c.textAlign = 'left';

    c.fillStyle = COL.muted; c.font = `700 28px ${FONT}`;
    c.fillText('PLANETARY ENERGY BALANCE', 40, 56);
    c.fillStyle = '#b9c7da'; c.font = `26px ${FONT}`;
    c.fillText(p.atmosphere ? `One-layer atmosphere, ε = ${p.eps.toFixed(2)}` : 'No atmosphere (bare planet)', 40, 98);
    c.fillText(p.iceFeedback ? 'Ice–albedo feedback ON' : 'Ice–albedo feedback off (ice is visual only)', 40, 132);

    const Tc = SIM.Ts - 273.15;
    c.fillStyle = COL.muted; c.font = `28px ${FONT}`; c.fillText('Surface temperature', 40, 196);
    c.fillStyle = tempColor(Tc); c.font = `700 112px ${FONT}`;
    c.fillText(`${Tc.toFixed(1)} °C`, 36, 300);
    c.fillStyle = '#b9c7da'; c.font = `26px ${FONT}`;
    c.fillText(`${SIM.Ts.toFixed(1)} K   ·   heading to ${(equilibriumTs() - 273.15).toFixed(1)} °C`, 40, 344);

    c.fillStyle = COL.muted; c.font = `28px ${FONT}`; c.fillText('Energy imbalance (top of atmosphere)', 40, 404);
    const imb = f.imbalance, bal = Math.abs(imb) < 0.05;
    c.fillStyle = bal ? '#7ee0a0' : imb > 0 ? '#ff8a6b' : '#7cc4ff';
    c.font = `700 46px ${FONT}`;
    c.fillText(bal ? '0.0 W/m²  balanced' : `${imb > 0 ? '+' : '−'}${Math.abs(imb).toFixed(1)} W/m²  ${imb > 0 ? 'warming' : 'cooling'}`, 40, 456);

    // Flux table
    const x0 = 600, x1 = 984;
    c.fillStyle = COL.muted; c.font = `700 24px ${FONT}`;
    c.fillText('GLOBAL-MEAN FLUXES (W/m²)', x0, 196);
    const rows = [
      [COL.sun, 'Incoming sunlight', f.Q],
      [COL.reflected, 'Reflected sunlight', f.reflected],
      [COL.surfIR, 'Infrared from surface', f.surfIR],
      [COL.atmos, 'Absorbed by atmosphere', p.atmosphere ? f.atmAbs : null],
      [COL.atmIR, 'Back-radiation', p.atmosphere ? f.back : null],
      ['#ffb07a', 'Infrared to space', f.olr],
      [null, 'Effective albedo', null]
    ];
    rows.forEach((r, k) => {
      const y = 244 + k * 36;
      if (r[0]) { c.fillStyle = r[0]; c.beginPath(); c.arc(x0 + 8, y - 8, 8, 0, 2 * Math.PI); c.fill(); }
      c.fillStyle = COL.text; c.font = `24px ${FONT}`; c.textAlign = 'left';
      c.fillText(r[1], x0 + 26, y);
      c.textAlign = 'right'; c.font = `600 24px ${FONT}`;
      const val = k === 6 ? f.a.toFixed(2) : (r[2] === null ? '—' : r[2].toFixed(0));
      c.fillText(val, x1, y);
      c.textAlign = 'left';
    });

    // Time series of surface temperature
    const px0 = 96, px1 = 984, py0 = 530, py1 = 728;
    const tNow = SIM.year, tA = Math.max(0, tNow - WINDOW), tB = Math.max(WINDOW, tNow);
    const pts = SIM.history.map(h => [h[0], h[1] - 273.15]); pts.push([tNow, Tc]);
    let lo = Math.min(15, ...pts.map(q => q[1])), hi = Math.max(15, ...pts.map(q => q[1]));
    if (hi - lo < 10) { const m = (hi + lo) / 2; lo = m - 5; hi = m + 5; }
    const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
    const X = tt => px0 + (tt - tA) / (tB - tA) * (px1 - px0);
    const Y = v => py1 - (v - lo) / (hi - lo) * (py1 - py0);
    c.fillStyle = COL.muted; c.font = `24px ${FONT}`;
    c.fillText(`Surface temperature (°C), last ${WINDOW} model years   ·   year ${tNow.toFixed(1)}`, 40, 504);
    const span = hi - lo, stepG = span <= 20 ? 5 : span <= 50 ? 10 : span <= 120 ? 20 : 50;
    c.strokeStyle = 'rgba(143,163,191,0.25)'; c.lineWidth = 1; c.textAlign = 'right'; c.font = `20px ${FONT}`;
    for (let v = Math.ceil(lo / stepG) * stepG; v <= hi; v += stepG) {
      c.beginPath(); c.moveTo(px0, Y(v)); c.lineTo(px1, Y(v)); c.stroke();
      c.fillStyle = COL.muted; c.fillText(v.toFixed(0), px0 - 10, Y(v) + 7);
    }
    c.setLineDash([10, 8]); c.strokeStyle = 'rgba(126,224,160,0.7)';
    c.beginPath(); c.moveTo(px0, Y(15)); c.lineTo(px1, Y(15)); c.stroke(); c.setLineDash([]);
    c.textAlign = 'left'; c.fillStyle = 'rgba(126,224,160,0.9)'; c.fillText('present day', px0 + 8, Y(15) - 8);
    c.strokeStyle = '#ffd166'; c.lineWidth = 4; c.beginPath();
    pts.forEach((q, k) => { const xx = X(q[0]), yy = Y(q[1]); if (k) c.lineTo(xx, yy); else c.moveTo(xx, yy); });
    c.stroke();
    this.c.tex.needsUpdate = true;
  }
});

// ---------- Draggable slider (works with Quest controllers and a mouse) ----------
AFRAME.registerComponent('ui-slider', {
  schema: { key: { type: 'string' }, min: { type: 'number' }, max: { type: 'number' },
            step: { type: 'number', default: 1 }, decimals: { type: 'int', default: 0 },
            label: { type: 'string' }, unit: { type: 'string', default: '' },
            width: { type: 'number', default: 0.56 }, enabledIf: { type: 'string', default: '' } },
  init: function () {
    const d = this.data, w = d.width, o = this.el.object3D;
    this.el.classList.add('clickable');
    const basic = (col, opts) => new THREE.MeshBasicMaterial(Object.assign({ color: col, transparent: true }, opts || {}));
    this.label = makeCanvasPlane(w, 640, 52);
    this.label.mesh.position.set(0, 0.028, 0.001); o.add(this.label.mesh);
    this.trackMat = basic('#26364d');
    const track = new THREE.Mesh(new THREE.PlaneGeometry(w, 0.012), this.trackMat);
    track.position.set(0, -0.018, 0.001); o.add(track);
    const fg = new THREE.PlaneGeometry(w, 0.012); fg.translate(w / 2, 0, 0);
    this.fillMat = basic('#4aa3df');
    this.fill = new THREE.Mesh(fg, this.fillMat); this.fill.position.set(-w / 2, -0.018, 0.0015); o.add(this.fill);
    this.knobMat = basic('#eef3f8');
    this.knob = new THREE.Mesh(new THREE.CircleGeometry(0.02, 32), this.knobMat);
    this.knob.position.set(0, -0.018, 0.002); o.add(this.knob);
    const hit = new THREE.Mesh(new THREE.PlaneGeometry(w + 0.06, 0.1), basic('#ffffff', { opacity: 0, depthWrite: false }));
    hit.position.set(0, 0.005, 0.0005); o.add(hit);
    this.hover = false; this.dragging = false; this.drawn = '';
    this.el.addEventListener('mouseenter', () => { this.hover = true; });
    this.el.addEventListener('mouseleave', () => { this.hover = false; });
    this.el.addEventListener('mousedown', (e) => {
      if (!this.enabled()) return;
      this.cursorEl = e.detail.cursorEl; this.dragging = true;
      this.setFromHit(e.detail.intersection);
      const cam = document.querySelector('[camera]');
      if (this.cursorEl === this.el.sceneEl && cam) cam.setAttribute('look-controls', 'enabled', false);
      const up = () => {
        this.dragging = false;
        if (cam) cam.setAttribute('look-controls', 'enabled', true);
        this.cursorEl.removeEventListener('mouseup', up);
      };
      this.cursorEl.addEventListener('mouseup', up);
    });
  },
  enabled: function () { return !this.data.enabledIf || !!SIM.params[this.data.enabledIf]; },
  setFromHit: function (hit) {
    if (!hit) return;
    const d = this.data, lp = this.el.object3D.worldToLocal(hit.point.clone());
    const frac = clamp((lp.x + d.width / 2) / d.width, 0, 1);
    let v = d.min + frac * (d.max - d.min);
    v = Math.round(v / d.step) * d.step;
    SIM.params[d.key] = clamp(v, d.min, d.max);
  },
  tick: function () {
    const d = this.data;
    if (this.dragging && this.cursorEl && this.cursorEl.components.raycaster) {
      this.setFromHit(this.cursorEl.components.raycaster.getIntersection(this.el));
    }
    const v = SIM.params[d.key], frac = (v - d.min) / (d.max - d.min), en = this.enabled();
    this.knob.position.x = -d.width / 2 + frac * d.width;
    this.fill.scale.x = Math.max(frac, 0.0001);
    const a = en ? 1 : 0.3;
    this.trackMat.opacity = a; this.fillMat.opacity = a; this.knobMat.opacity = a; this.label.mat.opacity = a;
    this.knobMat.color.set(en && (this.hover || this.dragging) ? '#ffd166' : '#eef3f8');
    this.knob.scale.setScalar(en && (this.hover || this.dragging) ? 1.25 : 1);
    const txt = `${d.label}|${v.toFixed(d.decimals)} ${d.unit}`;
    if (txt !== this.drawn) {
      this.drawn = txt;
      const c = this.label.ctx; c.clearRect(0, 0, 640, 52);
      c.textBaseline = 'middle'; c.fillStyle = COL.text;
      c.font = `30px ${FONT}`; c.textAlign = 'left'; c.fillText(d.label, 2, 28);
      c.font = `700 30px ${FONT}`; c.textAlign = 'right'; c.fillText(`${v.toFixed(d.decimals)} ${d.unit}`, 638, 28);
      this.label.tex.needsUpdate = true;
    }
  }
});

// ---------- Buttons ----------
AFRAME.registerComponent('ui-button', {
  schema: { action: { type: 'string' }, width: { type: 'number', default: 0.27 } },
  init: function () {
    this.el.classList.add('clickable');
    this.c = makeCanvasPlane(this.data.width, 512, 124);
    this.el.object3D.add(this.c.mesh);
    this.hover = false; this.drawn = '';
    this.el.addEventListener('mouseenter', () => { this.hover = true; });
    this.el.addEventListener('mouseleave', () => { this.hover = false; });
    this.el.addEventListener('click', () => {
      const p = SIM.params;
      switch (this.data.action) {
        case 'atmosphere': setAtmosphere(!p.atmosphere); break;
        case 'ice': p.iceFeedback = !p.iceFeedback; break;
        case 'pause': p.paused = !p.paused; break;
        case 'reset': resetSim(); break;
      }
    });
  },
  state: function () {
    const p = SIM.params;
    switch (this.data.action) {
      case 'atmosphere': return [`Atmosphere: ${p.atmosphere ? 'ON' : 'OFF'}`, p.atmosphere];
      case 'ice': return [`Ice–albedo feedback: ${p.iceFeedback ? 'ON' : 'OFF'}`, p.iceFeedback];
      case 'pause': return [p.paused ? '▶  Resume' : '❚❚  Pause', p.paused];
      default: return ['↺  Reset to present Earth', false];
    }
  },
  tick: function () {
    const [label, active] = this.state();
    const key = label + active + this.hover;
    if (key === this.drawn) return;
    this.drawn = key;
    const c = this.c.ctx;
    c.clearRect(0, 0, 512, 124);
    c.fillStyle = active ? (this.hover ? '#3a86b8' : '#2a6f97') : (this.hover ? '#2c3e55' : '#1b2738');
    roundRect(c, 4, 4, 504, 116, 22); c.fill();
    c.strokeStyle = this.hover ? '#ffd166' : 'rgba(143,163,191,0.4)'; c.lineWidth = 4;
    roundRect(c, 4, 4, 504, 116, 22); c.stroke();
    c.fillStyle = COL.text; c.font = `600 32px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(label, 256, 64);
    this.c.tex.needsUpdate = true;
  }
});
    </script>
  </head>
  <body>
    <!--
      PLANETARY ENERGY BALANCE in VR
      Desktop: drag to look around, WASD to move, click and drag the sliders.
      Quest: open in the browser, press the VR button, and point at the panel with
      either controller; hold the trigger to drag a slider, click to press a button.
    -->
    <a-scene background="color: #03050a"
             light="defaultLightsEnabled: false"
             renderer="antialias: true; colorManagement: true"
             cursor="rayOrigin: mouse; fuse: false"
             raycaster="objects: .clickable; far: 20"
             sim-runner star-field>

      <a-entity light="type: ambient; color: #9fb4d0; intensity: 0.3"></a-entity>

      <!-- A small platform under your feet, which helps with comfort in VR -->
      <a-circle radius="1" rotation="-90 0 0" position="0 0.002 0"
                material="shader: flat; color: #0f1a2b; opacity: 0.9; transparent: true"></a-circle>
      <a-ring radius-inner="0.98" radius-outer="1.02" rotation="-90 0 0" position="0 0.004 0"
              material="shader: flat; color: #2f7fb8"></a-ring>

      <!-- Earth, Sun, atmosphere and flux particles -->
      <a-entity planet-system position="0 1.85 -2.6"></a-entity>

      <!-- Labels in the scene -->
      <a-entity world-label="text: Sunlight is intercepted by a disc of area πR²; color: #ffe066; width: 1.3"
                position="-1.45 2.45 -2.6"></a-entity>
      <a-entity world-label="text: Reflected sunlight; color: #fff4cc; width: 0.7"
                position="-1.3 1.25 -2.4"></a-entity>
      <a-entity world-label="text: Infrared leaves from the whole sphere, area 4πR²; color: #ff7a33; width: 1.4"
                position="0 2.85 -2.6"></a-entity>
      <a-entity world-label="text: Atmosphere absorbs infrared and re-emits it up and down; color: #8cc8ff; width: 1.0; showIf: atmosphere"
                position="1.35 1.9 -2.4"></a-entity>

      <!-- Control panel -->
      <a-entity id="panel" position="0.55 1.12 -1.1" rotation="-30 -20 0">
        <a-plane width="1.46" height="0.66" position="0 0 -0.004" material="shader: flat; color: #2a3b55"></a-plane>
        <a-plane width="1.44" height="0.64" position="0 0 -0.002" material="shader: flat; color: #0b1320"></a-plane>

        <a-entity info-display position="-0.33 0 0.001"></a-entity>

        <a-entity ui-slider="key: S0; min: 800; max: 2000; step: 1; decimals: 0; label: Solar constant S₀; unit: W/m²"
                  position="0.36 0.245 0.002"></a-entity>
        <a-entity ui-slider="key: albedo; min: 0; max: 0.9; step: 0.01; decimals: 2; label: Albedo α"
                  position="0.36 0.15 0.002"></a-entity>
        <a-entity ui-slider="key: eps; min: 0; max: 1; step: 0.01; decimals: 2; label: Greenhouse emissivity ε; enabledIf: atmosphere"
                  position="0.36 0.055 0.002"></a-entity>
        <a-entity ui-slider="key: speed; min: 0.1; max: 5; step: 0.1; decimals: 1; label: Simulation speed; unit: yr/s"
                  position="0.36 -0.04 0.002"></a-entity>

        <a-entity ui-button="action: atmosphere" position="0.215 -0.135 0.002"></a-entity>
        <a-entity ui-button="action: ice" position="0.505 -0.135 0.002"></a-entity>
        <a-entity ui-button="action: pause" position="0.215 -0.225 0.002"></a-entity>
        <a-entity ui-button="action: reset" position="0.505 -0.225 0.002"></a-entity>
      </a-entity>

      <!-- Camera and Quest controllers (laser pointers) -->
      <a-entity id="rig">
        <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
        <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 6; lineColor: #9fd3ff; lineOpacity: 0.7"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 6; lineColor: #9fd3ff; lineOpacity: 0.7"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
