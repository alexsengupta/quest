<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fish School (VR)</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script>
// ===================== MODEL (no graphics) =====================
// 3D agent-based fish school. The same three rules as the 2D flocking app
// (separation, alignment, cohesion), now in metres and seconds:
//   Separation: for each neighbour inside personal space Rs, a unit push away scaled by (1 - d/Rs)
//   Alignment:  (mean neighbour velocity - own velocity) / v0
//   Cohesion:   (centre of neighbours - own position) / R
//   a = gain * v0 * (ws*Fsep + wa*Fali + wc*Fcoh), capped at aMax * v0, plus a pull back to cruising speed.
// Fish see neighbours for alignment and cohesion only outside a blind cone behind them;
// very close neighbours (separation) are sensed all round, as with the lateral line.
// The ocean wraps around horizontally in a 22 m square centred on the viewer, so there are no
// side walls for schools to bump into; the seam sits deep in the haze where it cannot be seen.
// Vertically, fish stay between the seabed and the surface and prefer to swim level.
// Two responses to danger (p.herd):
//   flee (0):         social rules weaken and each alarmed fish steers directly away from the threat.
//   selfish herd (1): alarmed fish draw closer to their neighbours instead (Hamilton 1971): cohesion
//                     strengthens, alignment weakens and personal space shrinks; a fish only darts away
//                     when a threat is very close. Together with predators that herd the school from
//                     several sides (p.herdPreds), this produces a compact bait ball.
const FIX = {
  BL: 0.2,            // body length (m)
  v0: 0.6,            // cruising speed (m/s) = 3 body lengths per second
  gain: 1.5,          // social forces -> acceleration (1/s, times v0)
  aMax: 2.0,          // default turning limit (1/s, times v0) = largest turning rate in rad/s; p.turn overrides it
  relax: 2.0,         // return to cruising speed (1/s)
  noise: 0.3,         // random turning (1/s, times v0): fish are not perfect rule-followers
  pitch: 0.8,         // damping of vertical swimming (1/s): fish prefer to swim level
  fearR: 2.6,         // a threat within this distance alarms a fish (m)
  escape: 3,          // escape acceleration, multiple of aMax
  predSpeed: 1.0,     // predator top speed (m/s)
  predAcc: 0.9,       // predator acceleration limit (m/s2)
  huntRange: 6, catchR: 0.25, handling: 3.0, retarget: 1.5,
  L: 22,              // horizontal size of the wrapping ocean (m)
  yLo: 0.9, yHi: 4.4, // preferred depth band (heights above the seabed, m)
  wall: 3.0,          // strength of the soft push back into the depth band (1/s, times v0)
  bodyR: 0.75,        // fish keep this far from the viewer's body (m)
  dt: 1 / 30          // model time step (s)
};

function Model(p) {
  this.p = p;               // live parameters: sep, ali, coh, R, Rsep, blind
  this.n = 0; this.cap = 0;
  this.preds = []; this.scares = []; this.threats = []; this.hands = [];
  this.viewer = { x: 0, y: 1.6, z: 0, on: true };
  this.catches = 0; this.t = 0;
  this.polar = 0; this.mill = 0; this.local = 0; this.main = 0; this.groups = 0;
  this.hist = []; this.histT = -1;
  this.acc = new Float32Array(3); this._env = new Float32Array(3);
  this._grow(1024);
}

Model.prototype._grow = function (cap) {
  const names = ['x', 'y', 'z', 'vx', 'vy', 'vz', 'ax', 'ay', 'az', 'px', 'py', 'pz', 'fear', 'loc'];
  for (const k of names) {
    const a = new Float32Array(cap);
    if (this[k]) a.set(this[k].subarray(0, this.n));
    this[k] = a;
  }
  const nb = new Uint16Array(cap); if (this.nb) nb.set(this.nb.subarray(0, this.n)); this.nb = nb;
  this.cellOf = new Int32Array(cap); this.cellIdx = new Int32Array(cap);
  this.S = new Float32Array(cap * 6); this.slot = new Int32Array(cap);
  this.cap = cap;
};

// Minimum-image horizontal separation in the wrapping ocean
Model.prototype.wrapD = function (d) { const L = FIX.L; return d > L / 2 ? d - L : d < -L / 2 ? d + L : d; };

// A random spot; far = only in the distant haze (so new fish swim in rather than pop up nearby)
Model.prototype._randomPoint = function (far) {
  const L = FIX.L, V = this.viewer;
  for (let k = 0; k < 60; k++) {
    const dx = (Math.random() - 0.5) * L, dz = (Math.random() - 0.5) * L, r = Math.hypot(dx, dz);
    if (r < (far ? 8 : 2.5)) continue;
    return [V.x + dx, FIX.yLo + Math.random() * (FIX.yHi - FIX.yLo), V.z + dz];
  }
  return [V.x + L * 0.45, 2.5, V.z];
};

Model.prototype.addFish = function (far) {
  if (this.n >= this.cap) this._grow(this.cap * 2);
  const i = this.n++, P = this._randomPoint(far);
  const a = Math.random() * Math.PI * 2, e = (Math.random() - 0.5) * 0.3, v = FIX.v0;
  this.x[i] = this.px[i] = P[0]; this.y[i] = this.py[i] = P[1]; this.z[i] = this.pz[i] = P[2];
  this.vx[i] = v * Math.cos(e) * Math.cos(a); this.vy[i] = v * Math.sin(e); this.vz[i] = v * Math.cos(e) * Math.sin(a);
  this.fear[i] = 0; this.nb[i] = 0; this.loc[i] = 0;
};

Model.prototype.setCount = function (n) {
  while (this.n < n) this.addFish(this.t > 0);
  if (this.n > n) this.n = n;
  for (const pr of this.preds) if (pr.target >= this.n) pr.target = -1;
};

Model.prototype._newPred = function () {
  const P = this._randomPoint(true), a = Math.random() * Math.PI * 2;
  return { x: P[0], y: P[1], z: P[2], px: P[0], py: P[1], pz: P[2],
           vx: Math.cos(a) * 0.5, vy: 0, vz: Math.sin(a) * 0.5,
           target: -1, retarget: 0, handle: 0, wa: a };
};

Model.prototype.setPredators = function (k) {
  while (this.preds.length < k) this.preds.push(this._newPred());
  this.preds.length = k;
};

// New random positions, scattered all around (some close, most further away)
Model.prototype.scatter = function () {
  const n = this.n; this.n = 0; this.t = 0;
  for (let i = 0; i < n; i++) this.addFish(false);
  for (let k = 0; k < this.preds.length; k++) this.preds[k] = this._newPred();
  this.catches = 0; this.hist = []; this.histT = -1; this.scares = []; this.herdC = null;
};

Model.prototype.scare = function (x, y, z) { this.scares.push({ x, y, z, life: 1.3 }); };

// Keep every fish inside the square of side L centred on the viewer (horizontal wrap)
Model.prototype._wrapAll = function () {
  const L = FIX.L, V = this.viewer, x0 = V.x - L / 2, z0 = V.z - L / 2;
  const wrap = (o, k, lo) => {
    const v = o[k];
    if (v < lo) { o[k] = v + L; return L; }
    if (v >= lo + L) { o[k] = v - L; return -L; }
    return 0;
  };
  for (let i = 0; i < this.n; i++) {
    let s = 0;
    if (this.x[i] < x0) s = L; else if (this.x[i] >= x0 + L) s = -L;
    if (s) { this.x[i] += s; this.px[i] += s; }
    s = 0;
    if (this.z[i] < z0) s = L; else if (this.z[i] >= z0 + L) s = -L;
    if (s) { this.z[i] += s; this.pz[i] += s; }
  }
  for (const pr of this.preds) {
    const sx = wrap(pr, 'x', x0); pr.px += sx;
    const sz = wrap(pr, 'z', z0); pr.pz += sz;
  }
};

// Uniform 3D grid, cells at least R wide, periodic horizontally: all neighbours lie in the 3x3x3 block
Model.prototype.buildGrid = function () {
  const R = Math.max(this.p.R, LINK), L = FIX.L, V = this.viewer;   // cells also serve the school finder
  this.gx0 = V.x - L / 2; this.gz0 = V.z - L / 2; this.gy0 = -0.5;
  const Ly = 7.5;
  const nx = Math.max(3, Math.floor(L / R)), ny = Math.max(1, Math.floor(Ly / R)), nz = nx;
  const nc = nx * ny * nz;
  if (!this.cellStart || this.cellStart.length !== nc + 1) { this.cellStart = new Int32Array(nc + 1); this.cellFill = new Int32Array(nc); }
  this.nx = nx; this.ny = ny; this.nz = nz;
  this.cwx = L / nx; this.cwy = Ly / ny; this.cwz = L / nz;
  const start = this.cellStart, fill = this.cellFill;
  start.fill(0);
  for (let i = 0; i < this.n; i++) {
    const c = this._cell(this.x[i], this.y[i], this.z[i]);
    this.cellOf[i] = c; start[c + 1]++;
  }
  for (let k = 0; k < nc; k++) start[k + 1] += start[k];
  for (let k = 0; k < nc; k++) fill[k] = start[k];
  for (let i = 0; i < this.n; i++) this.cellIdx[fill[this.cellOf[i]]++] = i;
  // Copies of positions and velocities in cell order, so the neighbour loop reads memory in sequence
  const S = this.S, idx = this.cellIdx;
  for (let m = 0; m < this.n; m++) {
    const j = idx[m], o = m * 6;
    S[o] = this.x[j]; S[o + 1] = this.y[j]; S[o + 2] = this.z[j];
    S[o + 3] = this.vx[j]; S[o + 4] = this.vy[j]; S[o + 5] = this.vz[j];
    this.slot[j] = m;
  }
};

Model.prototype._ci = function (v, v0, w, n) { const c = Math.floor((v - v0) / w); return c < 0 ? 0 : c >= n ? n - 1 : c; };
Model.prototype._cell = function (x, y, z) {
  return (this._ci(z, this.gz0, this.cwz, this.nz) * this.ny + this._ci(y, this.gy0, this.cwy, this.ny)) * this.nx
       + this._ci(x, this.gx0, this.cwx, this.nx);
};

// Steering acceleration from the three social rules for fish i (written into this.acc)
Model.prototype.social = function (i, u) {
  const p = this.p, L = FIX.L, hL = L / 2;
  const h = p.herd && u > 0 ? Math.min(1, 2.5 * u) : 0;   // selfish-herd compaction when alarmed
  const R = p.R, R2 = R * R, Rs = Math.min(p.Rsep, R) * (1 - 0.45 * h), Rs2 = Rs * Rs;
  const wa = p.ali * (1 - 0.9 * h), wc = p.coh * (1 + 4 * h);
  const cosBlind = Math.cos(Math.PI - p.blind * Math.PI / 360);   // blind = full width of the blind cone (degrees)
  const useBlind = p.blind > 0.5;
  const xi = this.x[i], yi = this.y[i], zi = this.z[i], vxi = this.vx[i], vyi = this.vy[i], vzi = this.vz[i];
  const si = Math.sqrt(vxi * vxi + vyi * vyi + vzi * vzi) || 1;
  let n = 0, svx = 0, svy = 0, svz = 0, sdx = 0, sdy = 0, sdz = 0, sx = 0, sy = 0, sz = 0;
  const nx = this.nx, ny = this.ny, nz = this.nz;
  const c = this.cellOf[i], cx = c % nx, cy = Math.floor(c / nx) % ny, cz = Math.floor(c / (nx * ny));
  const start = this.cellStart, S = this.S, me = this.slot[i];
  const y0 = Math.max(0, cy - 1), y1 = Math.min(ny - 1, cy + 1);
  for (let dzc = -1; dzc <= 1; dzc++) {
    const kz = (cz + dzc + nz) % nz;
    for (let ky = y0; ky <= y1; ky++) {
      const row = (kz * ny + ky) * nx;
      for (let dxc = -1; dxc <= 1; dxc++) {
        const cc = row + (cx + dxc + nx) % nx, end = start[cc + 1];
        for (let m = start[cc]; m < end; m++) {
          if (m === me) continue;
          const o = m * 6;
          let dx = S[o] - xi, dz = S[o + 2] - zi;
          if (dx > hL) dx -= L; else if (dx < -hL) dx += L;
          if (dz > hL) dz -= L; else if (dz < -hL) dz += L;
          const dy = S[o + 1] - yi, d2 = dx * dx + dy * dy + dz * dz;
          if (d2 >= R2) continue;
          if (d2 < Rs2 && d2 > 1e-12) {
            const d = Math.sqrt(d2), w = (1 - d / Rs) / d;
            sx -= dx * w; sy -= dy * w; sz -= dz * w;
          }
          if (useBlind && (dx * vxi + dy * vyi + dz * vzi) < cosBlind * si * Math.sqrt(d2)) continue;  // behind: not seen
          n++; svx += S[o + 3]; svy += S[o + 4]; svz += S[o + 5]; sdx += dx; sdy += dy; sdz += dz;
        }
      }
    }
  }
  this.nb[i] = n;
  // local alignment: cosine between own heading and the mean heading of the fish it sees
  const vm = Math.sqrt(svx * svx + svy * svy + svz * svz);
  this.loc[i] = n > 0 && vm > 1e-9 ? (svx * vxi + svy * vyi + svz * vzi) / (vm * si) : 0;
  const v0 = FIX.v0, a = this.acc;
  let ax = p.sep * sx, ay = p.sep * sy, az = p.sep * sz;
  if (n > 0) {
    ax += wa * (svx / n - vxi) / v0 + wc * (sdx / n) / R;
    ay += wa * (svy / n - vyi) / v0 + wc * (sdy / n) / R;
    az += wa * (svz / n - vzi) / v0 + wc * (sdz / n) / R;
  }
  const g = FIX.gain * v0; ax *= g; ay *= g; az *= g;
  const f = Math.sqrt(ax * ax + ay * ay + az * az), mf = (p.turn || FIX.aMax) * v0;
  if (f > mf) { ax *= mf / f; ay *= mf / f; az *= mf / f; }
  a[0] = ax; a[1] = ay; a[2] = az;
  return a;
};

// Depth band, level swimming and the viewer's body
Model.prototype.environment = function (x, y, z, vy, out) {
  const v0 = FIX.v0, k = FIX.wall * v0;
  let ay = -FIX.pitch * vy;
  if (y < FIX.yLo) ay += k * (FIX.yLo - y) * 2;
  if (y > FIX.yHi) ay -= k * (y - FIX.yHi) * 2;
  let ax = 0, az = 0;
  const V = this.viewer;
  if (V.on) {   // the viewer's body: a vertical segment from the floor to just above the head
    const hy = Math.max(0.2, Math.min(V.y + 0.15, y));
    const dx = this.wrapD(x - V.x), dy = y - hy, dz = this.wrapD(z - V.z);
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz), r = FIX.bodyR;
    if (d < r && d > 1e-6) {
      const s = 10 * v0 * (1 - d / r) / d;
      ax += s * dx; ay += s * dy; az += s * dz;
    }
  }
  out[0] = ax; out[1] = ay; out[2] = az;
  return out;
};

Model.prototype.step = function () {
  const dt = FIX.dt, n = this.n, v0 = FIX.v0, env = this._env;
  this._wrapAll();
  this.buildGrid();
  const src = this.threats;          // predators, startle points and gripping hands
  src.length = 0;
  for (const pr of this.preds) src.push(pr);
  for (const s of this.scares) src.push(s);
  for (const h of this.hands) if (h.on) src.push(h);
  const fearR = FIX.fearR, mf = FIX.aMax * v0, noise = (this.p.noise !== undefined ? this.p.noise : FIX.noise) * v0 * 1.7;
  const x = this.x, y = this.y, z = this.z, vx = this.vx, vy = this.vy, vz = this.vz;

  // 1. Every fish decides from the same snapshot
  for (let i = 0; i < n; i++) {
    const s = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i] + vz[i] * vz[i]) || 1;
    let u = 0, fx = 0, fy = 0, fz = 0, dmin = 1e9;
    for (let k = 0; k < src.length; k++) {
      const dx = this.wrapD(x[i] - src[k].x), dy = y[i] - src[k].y, dz = this.wrapD(z[i] - src[k].z);
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d < fearR && d > 1e-6) { const w = 1 - d / fearR; fx += dx / d * w; fy += dy / d * w; fz += dz / d * w; if (w > u) u = w; if (d < dmin) dmin = d; }
    }
    const a = this.social(i, u);
    let ax = a[0], ay = a[1], az = a[2];
    const rel = FIX.relax * (v0 * (1 + 0.6 * u) - s);
    ax += rel * vx[i] / s; ay += rel * vy[i] / s; az += rel * vz[i] / s;
    // flee: escape scales with alarm. Selfish herd: only a short dart when the threat is within 40% of fearR
    const ue = this.p.herd ? Math.max((this.p.herdEsc || 0.8) * u, 1 - dmin / (0.4 * fearR)) : u;
    if (ue > 0) {
      const fm = Math.sqrt(fx * fx + fy * fy + fz * fz) || 1, sp = v0 * (1 + 0.6 * u);
      let ex = fx / fm * sp - vx[i], ey = fy / fm * sp - vy[i], ez = fz / fm * sp - vz[i];
      const em = Math.sqrt(ex * ex + ey * ey + ez * ez), cap = mf * FIX.escape * ue;
      if (em > cap) { ex *= cap / em; ey *= cap / em; ez *= cap / em; }
      ax = ax * (1 - 0.8 * ue) + ex; ay = ay * (1 - 0.8 * ue) + ey; az = az * (1 - 0.8 * ue) + ez;
    }
    ax += (Math.random() - 0.5) * noise; ay += (Math.random() - 0.5) * noise * 0.5; az += (Math.random() - 0.5) * noise;
    this.environment(x[i], y[i], z[i], vy[i], env);
    this.ax[i] = ax + env[0]; this.ay[i] = ay + env[1]; this.az[i] = az + env[2];
    this.fear[i] = u;
  }
  // 2. Then everyone moves
  for (let i = 0; i < n; i++) {
    let nvx = vx[i] + this.ax[i] * dt, nvy = vy[i] + this.ay[i] * dt, nvz = vz[i] + this.az[i] * dt;
    const cap = v0 * (1.6 + 0.6 * this.fear[i]), s = Math.sqrt(nvx * nvx + nvy * nvy + nvz * nvz);
    if (s > cap) { nvx *= cap / s; nvy *= cap / s; nvz *= cap / s; }
    vx[i] = nvx; vy[i] = nvy; vz[i] = nvz;
    this.px[i] = x[i]; this.py[i] = y[i]; this.pz[i] = z[i];
    x[i] += nvx * dt; y[i] = Math.min(6.2, Math.max(0.12, y[i] + nvy * dt)); z[i] += nvz * dt;
  }
  this.orbit = (this.orbit || 0) + dt * 0.25;
  if (this.p.herdPreds && this.preds.length) this._trackHerd();
  this.preds.forEach((pr, k) => this._stepPred(pr, k));
  for (let k = this.scares.length - 1; k >= 0; k--) if ((this.scares[k].life -= dt) <= 0) this.scares.splice(k, 1);
  this.t += dt;
  if (this.t - this.histT >= 0.25) {
    this.histT = this.t;
    this.order();
    this.hist.push([this.t, this.polar, this.mill, this.local]);
    if (this.hist.length > 240) this.hist.shift();
  }
};

// Order parameters (Couzin et al. 2002) for the largest school:
//   polarisation P = |mean heading|; milling M = |mean of (r_hat x v_hat)| about the school's centre.
// A school is a set of fish joined by links shorter than LINK (4 body lengths), found with union-find.
const LINK = 0.8;
Model.prototype._find = function (i) { const pa = this._par; while (pa[i] !== i) { pa[i] = pa[pa[i]]; i = pa[i]; } return i; };
Model.prototype.order = function () {
  const n = this.n; if (!n) { this.polar = this.mill = this.main = this.groups = 0; return; }
  if (!this._par || this._par.length < this.cap) { this._par = new Int32Array(this.cap); this._sz = new Int32Array(this.cap); this._mem = new Int32Array(this.cap); }
  const pa = this._par, sz = this._sz, L = FIX.L, hL = L / 2, L2 = LINK * LINK;
  for (let i = 0; i < n; i++) { pa[i] = i; sz[i] = 0; }
  const nx = this.nx, ny = this.ny, nz = this.nz, start = this.cellStart, idx = this.cellIdx;
  for (let i = 0; i < n; i++) {
    const c = this.cellOf[i], cx = c % nx, cy = Math.floor(c / nx) % ny, cz = Math.floor(c / (nx * ny));
    for (let dzc = -1; dzc <= 1; dzc++) for (let ky = Math.max(0, cy - 1); ky <= Math.min(ny - 1, cy + 1); ky++) {
      const row = (((cz + dzc + nz) % nz) * ny + ky) * nx;
      for (let dxc = -1; dxc <= 1; dxc++) {
        const cc = row + (cx + dxc + nx) % nx;
        for (let m = start[cc]; m < start[cc + 1]; m++) {
          const j = idx[m]; if (j <= i) continue;
          let dx = this.x[j] - this.x[i], dz = this.z[j] - this.z[i];
          if (dx > hL) dx -= L; else if (dx < -hL) dx += L;
          if (dz > hL) dz -= L; else if (dz < -hL) dz += L;
          const dy = this.y[j] - this.y[i];
          if (dx * dx + dy * dy + dz * dz < L2) { const a = this._find(i), b = this._find(j); if (a !== b) pa[a] = b; }
        }
      }
    }
  }
  let best = 0, groups = 0, alone = 0;
  for (let i = 0; i < n; i++) sz[this._find(i)]++;
  for (let i = 0; i < n; i++) if (pa[i] === i) {
    if (sz[i] >= 10) groups++;
    if (sz[i] < 3) alone += sz[i];
    if (sz[i] > sz[best] || pa[best] !== best) best = i;
  }
  this.groups = groups; this.main = sz[best]; this.alone = alone;
  // positions relative to one member (minimum image), then centre, heading and rotation
  const mem = this._mem; let k = 0;
  for (let i = 0; i < n; i++) if (this._find(i) === best) mem[k++] = i;
  const ref = mem[0];
  let cx = 0, cy = 0, cz = 0;
  for (let q = 0; q < k; q++) { const i = mem[q]; cx += this.wrapD(this.x[i] - this.x[ref]); cy += this.y[i]; cz += this.wrapD(this.z[i] - this.z[ref]); }
  cx /= k; cy /= k; cz /= k;
  let hx = 0, hy = 0, hz = 0, mx = 0, my = 0, mz = 0, Lc = 0;
  for (let q = 0; q < k; q++) {
    const i = mem[q];
    const s = Math.sqrt(this.vx[i] ** 2 + this.vy[i] ** 2 + this.vz[i] ** 2) || 1;
    const ux = this.vx[i] / s, uy = this.vy[i] / s, uz = this.vz[i] / s;
    hx += ux; hy += uy; hz += uz;
    const rx = this.wrapD(this.x[i] - this.x[ref]) - cx, ry = this.y[i] - cy, rz = this.wrapD(this.z[i] - this.z[ref]) - cz;
    const r = Math.sqrt(rx * rx + ry * ry + rz * rz) || 1;
    mx += (ry * uz - rz * uy) / r; my += (rz * ux - rx * uz) / r; mz += (rx * uy - ry * ux) / r;
    Lc += this.loc[i];
  }
  this.polar = Math.sqrt(hx * hx + hy * hy + hz * hz) / k;
  this.mill = Math.sqrt(mx * mx + my * my + mz * mz) / k;
  this.local = Lc / k;
  let r2 = 0;
  for (let q = 0; q < k; q++) {
    const i = mem[q], rx = this.wrapD(this.x[i] - this.x[ref]) - cx, ry = this.y[i] - cy, rz = this.wrapD(this.z[i] - this.z[ref]) - cz;
    r2 += rx * rx + ry * ry + rz * rz;
  }
  this.radius = Math.sqrt(r2 / k);          // radius of gyration of the largest school (m)
  this.centre = [this.x[ref] + cx, cy, this.z[ref] + cz];
};

Model.prototype._chooseTarget = function (pr) {
  let best = -1, bestScore = Infinity;
  for (let i = 0; i < this.n; i++) {
    const dx = this.wrapD(this.x[i] - pr.x), dy = this.y[i] - pr.y, dz = this.wrapD(this.z[i] - pr.z);
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (d > FIX.huntRange) continue;
    const score = d - Math.max(0, 6 - this.nb[i]) * 0.6;    // isolated fish look closer
    if (score < bestScore) { bestScore = score; best = i; }
  }
  return best;
};

// Herding predators work together on one school: they follow the centre of the fish within 3.5 m
// of their current herd centre (starting from the largest school), and its size.
Model.prototype._trackHerd = function () {
  if (!this.herdC) { if (!this.centre) return; this.herdC = this.centre.slice(); }
  const c = this.herdC, R2 = 3.5 * 3.5;
  let sx = 0, sy = 0, sz = 0, k = 0, hx = 0, hz = 0;
  for (let i = 0; i < this.n; i++) {
    const dx = this.wrapD(this.x[i] - c[0]), dy = this.y[i] - c[1], dz = this.wrapD(this.z[i] - c[2]);
    if (dx * dx + dy * dy + dz * dz < R2) { sx += dx; sy += dy; sz += dz; k++; hx += this.vx[i]; hz += this.vz[i]; }
  }
  if (k < 8) { this.herdC = this.centre ? this.centre.slice() : null; this.herdN = 0; return; }
  c[0] += sx / k; c[1] += sy / k; c[2] += sz / k;
  let r2 = 0;
  for (let i = 0; i < this.n; i++) {
    const dx = this.wrapD(this.x[i] - c[0]), dy = this.y[i] - c[1], dz = this.wrapD(this.z[i] - c[2]);
    const d2 = dx * dx + dy * dy + dz * dz; if (d2 < R2) r2 += d2;
  }
  this.herdN = k; this.herdR = Math.sqrt(r2 / k);
  this.herdH = Math.atan2(hz, hx);       // the school's heading: one predator always cuts across its path
};

Model.prototype._stepPred = function (pr, idx) {
  const dt = FIX.dt, env = this._env;
  let cap = FIX.predSpeed, tx, ty, tz, hunting = false;
  pr.px = pr.x; pr.py = pr.y; pr.pz = pr.z;
  if (pr.handle > 0) pr.handle -= dt;
  else if (this.p.herdPreds && !(pr.lunge > 0)) {
    // Herding: circle the largest school on a ring outside it, spread evenly; now and then one lunges in
    pr.nextLunge = (pr.nextLunge === undefined ? 4 + 6 * Math.random() : pr.nextLunge) - dt;
    if (pr.nextLunge <= 0 && this.herdC) { pr.lunge = 4; pr.nextLunge = 6 + 6 * Math.random(); pr.target = -1; }
    else if (this.herdC) {
      const np = this.preds.length, nr = np > 3 ? np - 1 : np, th = (this.herdH || 0) + 2 * Math.PI * (idx % nr) / nr;
      const rad = (this.herdR || 1) + 1.1, c = this.herdC;
      const lift = np > 3 && idx === np - 1 ? -1.2 : 0;           // with four, one predator works from below
      tx = this.wrapD(c[0] + rad * Math.cos(th) - pr.x); ty = c[1] + lift - pr.y; tz = this.wrapD(c[2] + rad * Math.sin(th) - pr.z);
      const dd = Math.sqrt(tx * tx + ty * ty + tz * tz);
      cap = Math.min(FIX.predSpeed * 2.2, 0.6 + dd * 1.5);        // herding predators are quick, and slow on arrival
      hunting = true;
    }
  }
  if (pr.handle <= 0 && !(this.p.herdPreds && !(pr.lunge > 0))) {
    if (pr.lunge > 0) { pr.lunge -= dt; if (pr.lunge <= 0) pr.target = -1; }
    if (pr.target >= this.n) pr.target = -1;
    if (pr.target < 0 || (pr.retarget -= dt) <= 0) { pr.target = this._chooseTarget(pr); pr.retarget = FIX.retarget; }
    if (pr.target >= 0) {
      const i = pr.target, dx = this.wrapD(this.x[i] - pr.x), dy = this.y[i] - pr.y, dz = this.wrapD(this.z[i] - pr.z);
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d > FIX.huntRange * 1.3) pr.target = -1;
      else if (d < FIX.catchR) { this._catch(pr, i); pr.lunge = 0; }
      else {   // aim at where the target is heading
        const look = Math.min(d / cap, 1.0);
        tx = dx + this.vx[i] * look; ty = dy + this.vy[i] * look; tz = dz + this.vz[i] * look; hunting = true;
      }
    }
  }
  if (!hunting) {   // cruise slowly, wandering
    cap = FIX.predSpeed * (pr.handle > 0 ? 0.4 : 0.55);
    pr.wa += (Math.random() - 0.5) * 0.12;
    tx = Math.cos(pr.wa); ty = 0; tz = Math.sin(pr.wa);
  }
  const m = Math.sqrt(tx * tx + ty * ty + tz * tz) || 1;
  let ax = tx / m * cap - pr.vx, ay = ty / m * cap - pr.vy, az = tz / m * cap - pr.vz;
  const am = Math.sqrt(ax * ax + ay * ay + az * az), lim = FIX.predAcc * (this.p.herdPreds ? 4 : 1);
  if (am > lim) { ax *= lim / am; ay *= lim / am; az *= lim / am; }
  this.environment(pr.x, pr.y, pr.z, pr.vy, env);
  pr.vx += (ax + env[0]) * dt; pr.vy += (ay + env[1]) * dt; pr.vz += (az + env[2]) * dt;
  const s = Math.sqrt(pr.vx ** 2 + pr.vy ** 2 + pr.vz ** 2), top = FIX.predSpeed * (this.p.herdPreds ? 2.3 : 1.2);
  if (s > top) { pr.vx *= top / s; pr.vy *= top / s; pr.vz *= top / s; }
  if (hunting) pr.wa = Math.atan2(pr.vz, pr.vx);
  pr.x += pr.vx * dt; pr.y = Math.min(5.5, Math.max(0.4, pr.y + pr.vy * dt)); pr.z += pr.vz * dt;
};

Model.prototype._catch = function (pr, i) {
  this.catches++;
  pr.handle = FIX.handling; pr.target = -1;
  for (let tries = 0; tries < 20; tries++) {     // a replacement fish arrives from the distant haze
    const P = this._randomPoint(true);
    let ok = true;
    for (const q of this.preds) if (this.wrapD(P[0] - q.x) ** 2 + this.wrapD(P[2] - q.z) ** 2 < 25) { ok = false; break; }
    if (ok || tries === 19) {
      const a = Math.random() * Math.PI * 2;
      this.x[i] = this.px[i] = P[0]; this.y[i] = this.py[i] = P[1]; this.z[i] = this.pz[i] = P[2];
      this.vx[i] = Math.cos(a) * FIX.v0; this.vy[i] = 0; this.vz[i] = Math.sin(a) * FIX.v0;
      this.fear[i] = 0;
      break;
    }
  }
};

// ===================== 2D MODEL =====================
// The model from the 2D flocking app, unchanged (world units; one body length = 8 units; one step = one frame at 60 Hz).
// Wrapped in its own namespace so it can sit beside the 3D model.
const Flat = (function () {
'use strict';
/* =====================================================================
   MODEL-BEGIN  (pure simulation code; no DOM access, testable in Node)
   ===================================================================== */
var FIX = {
  cruise: 3,          // preferred swimming speed, units per step
  maxForce: 0.1,      // largest change in velocity per step (inertia / turning limit)
  socialGain: 0.06,   // converts the (dimensionless) social forces into acceleration
  speedRelax: 0.05,   // how quickly a fish returns to its cruising speed
  bodyLength: 8,      // units
  predSpeed: 5,
  predForce: 0.08,
  huntRange: 300,
  retarget: 45,       // steps between target re-evaluation
  catchR: 7,
  handling: 90,       // steps a predator pauses after a catch
  fearR: 110,
  scareLife: 40
};
FIX.maxSpeed = FIX.cruise;

function Model(W, H, p) {
  this.p = p;          // live parameter object: sep, ali, coh, R, Rsep
  this.W = W; this.H = H;
  this.cap = 0;
  this.n = 0;
  this.preds = [];
  this.scares = [];
  this.catches = 0;
  this.t = 0;
  this.polar = 0;
  this.hist = new Float32Array(900);
  this.histLen = 0; this.histPos = 0;
  this._grow(512);
  this._gridKey = '';
  this._tmp = { sx: 0, sy: 0 };
  this.o = { n: 0, ns: 0, sepX: 0, sepY: 0, aliX: 0, aliY: 0, cohX: 0, cohY: 0,
             cx: 0, cy: 0, avx: 0, avy: 0, list: null, sepList: null };
}

Model.prototype._grow = function (cap) {
  var names = ['x', 'y', 'vx', 'vy', 'ax', 'ay', 'fear'];
  for (var k = 0; k < names.length; k++) {
    var a = new Float32Array(cap);
    if (this[names[k]]) a.set(this[names[k]].subarray(0, this.n));
    this[names[k]] = a;
  }
  var nb = new Uint16Array(cap); if (this.nb) nb.set(this.nb.subarray(0, this.n)); this.nb = nb;
  this.cellOf = new Int32Array(cap);
  this.cellIdx = new Int32Array(cap);
  this.cap = cap;
};

Model.prototype.wrapD = function (d, L) {
  return d > L * 0.5 ? d - L : (d < -L * 0.5 ? d + L : d);
};

Model.prototype.addFish = function (x, y, vx, vy) {
  if (this.n >= this.cap) this._grow(this.cap * 2);
  var i = this.n++;
  var a = Math.random() * Math.PI * 2;
  this.x[i] = x !== undefined ? x : Math.random() * this.W;
  this.y[i] = y !== undefined ? y : Math.random() * this.H;
  this.vx[i] = vx !== undefined ? vx : Math.cos(a) * FIX.maxSpeed;
  this.vy[i] = vy !== undefined ? vy : Math.sin(a) * FIX.maxSpeed;
  this.ax[i] = this.ay[i] = this.fear[i] = 0;
  return i;
};

Model.prototype.setCount = function (n) {
  while (this.n < n) this.addFish();
  if (this.n > n) this.n = n;
};

Model.prototype.scatter = function () {
  var n = this.n; this.n = 0;
  for (var i = 0; i < n; i++) this.addFish();
  for (var k = 0; k < this.preds.length; k++) this.preds[k] = this._newPred();
  this.catches = 0; this.t = 0; this.histLen = 0; this.histPos = 0; this.scares = [];
  this.polar = this.polarisation();
};

Model.prototype._newPred = function () {
  var a = Math.random() * Math.PI * 2;
  return { x: Math.random() * this.W, y: Math.random() * this.H,
           vx: Math.cos(a) * FIX.predSpeed * 0.6, vy: Math.sin(a) * FIX.predSpeed * 0.6,
           target: -1, retarget: 0, handle: 0 };
};

Model.prototype.setPredators = function (k) {
  while (this.preds.length < k) this.preds.push(this._newPred());
  this.preds.length = k;
};

Model.prototype.resize = function (W, H) {
  var sx = W / this.W, sy = H / this.H;
  for (var i = 0; i < this.n; i++) { this.x[i] *= sx; this.y[i] *= sy; }
  for (var k = 0; k < this.preds.length; k++) { this.preds[k].x *= sx; this.preds[k].y *= sy; }
  this.W = W; this.H = H;
};

Model.prototype.scare = function (x, y) {
  this.scares.push({ x: x, y: y, life: FIX.scareLife });
};

// Uniform grid with cells at least R wide, so all neighbours lie in the 3x3 block.
Model.prototype.buildGrid = function () {
  var R = this.p.R;
  var cols = Math.max(1, Math.floor(this.W / R));
  var rows = Math.max(1, Math.floor(this.H / R));
  var key = cols + 'x' + rows;
  if (key !== this._gridKey) {
    this._gridKey = key;
    this.cols = cols; this.rows = rows;
    this.cellStart = new Int32Array(cols * rows + 1);
    this.cellFill = new Int32Array(cols * rows);
    // Precompute the unique set of neighbouring cells (handles grids < 3 cells wide).
    this.nbrCells = [];
    for (var cy = 0; cy < rows; cy++) {
      for (var cx = 0; cx < cols; cx++) {
        var seen = {}, list = [];
        for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
          var c = ((cy + dy + rows) % rows) * cols + ((cx + dx + cols) % cols);
          if (!seen[c]) { seen[c] = 1; list.push(c); }
        }
        this.nbrCells.push(new Int32Array(list));
      }
    }
  }
  var cw = this.W / cols, ch = this.H / rows, ncell = cols * rows;
  var start = this.cellStart, fill = this.cellFill;
  start.fill(0);
  for (var i = 0; i < this.n; i++) {
    var gx = Math.min(cols - 1, Math.max(0, Math.floor(this.x[i] / cw)));
    var gy = Math.min(rows - 1, Math.max(0, Math.floor(this.y[i] / ch)));
    var c2 = gy * cols + gx;
    this.cellOf[i] = c2;
    start[c2 + 1]++;
  }
  for (var k = 0; k < ncell; k++) start[k + 1] += start[k];
  for (k = 0; k < ncell; k++) fill[k] = start[k];
  for (i = 0; i < this.n; i++) this.cellIdx[fill[this.cellOf[i]]++] = i;
};

// Steering helper for predators: desired = speed * d/|d|; steer = desired - v, limited to maxF.
Model.prototype._seek = function (dx, dy, vx, vy, speed, maxF) {
  var t = this._tmp;
  var m = Math.sqrt(dx * dx + dy * dy);
  if (m < 1e-9) { t.sx = 0; t.sy = 0; return t; }
  var sx = dx / m * speed - vx, sy = dy / m * speed - vy;
  var f = Math.sqrt(sx * sx + sy * sy);
  if (f > maxF) { sx *= maxF / f; sy *= maxF / f; }
  t.sx = sx; t.sy = sy;
  return t;
};

// The three social forces on fish i (unweighted, dimensionless), written into o.
//   Separation: for each neighbour inside personal space, a unit push directly away
//               from it, scaled by (1 - d/Rsep): zero at the edge, 1 when touching.
//   Alignment:  (average neighbour velocity - own velocity) / cruise speed.
//               Zero when already matching, larger the more mismatched.
//   Cohesion:   (centre of neighbours - own position) / R.
//               Points straight at the centre, stronger the further away it is.
// If o.list / o.sepList are arrays, neighbour indices are recorded (for drawing).
Model.prototype.steer = function (i, o) {
  var x = this.x, y = this.y, vx = this.vx, vy = this.vy;
  var W = this.W, H = this.H, hw = W * 0.5, hh = H * 0.5;
  var R = this.p.R, R2 = R * R, Rs = Math.min(this.p.Rsep, R), Rs2 = Rs * Rs;
  var xi = x[i], yi = y[i];
  var n = 0, ns = 0, svx = 0, svy = 0, sdx = 0, sdy = 0, px = 0, py = 0;
  var cells = this.nbrCells[this.cellOf[i]];
  var start = this.cellStart, idx = this.cellIdx;
  for (var k = 0; k < cells.length; k++) {
    var c = cells[k], end = start[c + 1];
    for (var m = start[c]; m < end; m++) {
      var j = idx[m];
      if (j === i) continue;
      var dx = x[j] - xi; if (dx > hw) dx -= W; else if (dx < -hw) dx += W;
      var dy = y[j] - yi; if (dy > hh) dy -= H; else if (dy < -hh) dy += H;
      var d2 = dx * dx + dy * dy;
      if (d2 >= R2) continue;
      n++; svx += vx[j]; svy += vy[j]; sdx += dx; sdy += dy;
      if (o.list) o.list.push(j);
      if (d2 < Rs2 && d2 > 1e-12) {
        var d = Math.sqrt(d2), w = (1 - d / Rs) / d;
        px -= dx * w; py -= dy * w;
        ns++;
        if (o.sepList) o.sepList.push(j);
      }
    }
  }
  var cr = FIX.cruise;
  o.n = n; o.ns = ns;
  o.sepX = px; o.sepY = py;
  o.aliX = o.aliY = o.cohX = o.cohY = o.cx = o.cy = o.avx = o.avy = 0;
  if (n > 0) {
    o.avx = svx / n; o.avy = svy / n;
    o.aliX = (o.avx - vx[i]) / cr; o.aliY = (o.avy - vy[i]) / cr;
    o.cx = sdx / n; o.cy = sdy / n;           // centre of neighbours, relative to fish i
    o.cohX = o.cx / R; o.cohY = o.cy / R;
  }
  return o;
};

// Social acceleration of fish i (before any fear response): weighted sum of the
// three forces, times socialGain, capped at maxForce, plus a gentle pull back
// towards cruising speed. Written into o.accX / o.accY; o.pushX/Y is the uncapped push.
Model.prototype.accel = function (i, o) {

  var ay = g * (p.sep * o.sepY + p.ali * o.aliY + p.coh * o.cohY);

};

Model.prototype.step = function () {
  var n = this.n, W = this.W, H = this.H;
  var x = this.x, y = this.y, vx = this.vx, vy = this.vy, ax = this.ax, ay = this.ay;
  var cr = FIX.cruise, mf = FIX.maxForce, fearR = FIX.fearR;
  this.buildGrid();

  // Threat sources: predators plus click/tap scares.
  var src = [];
  for (var k = 0; k < this.preds.length; k++) src.push(this.preds[k]);
  for (k = 0; k < this.scares.length; k++) src.push(this.scares[k]);

  // 1. Every fish computes its acceleration from the same snapshot.
  var o = this.o; o.list = null; o.sepList = null;
  for (var i = 0; i < n; i++) {
    this.accel(i, o);
    this.nb[i] = o.n;
    var axi = o.accX, ayi = o.accY;
    var u = 0, fx = 0, fy = 0;
    for (k = 0; k < src.length; k++) {
      var dx = this.wrapD(x[i] - src[k].x, W), dy = this.wrapD(y[i] - src[k].y, H);
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < fearR && d > 1e-6) {
        var w = 1 - d / fearR;
        fx += dx / d * w; fy += dy / d * w;

      axi = axi * (1 - 0.8 * u) + t.sx;
      ayi = ayi * (1 - 0.8 * u) + t.sy;

    var s = Math.sqrt(nvx * nvx + nvy * nvy);
    if (s > cap) { nvx *= cap / s; nvy *= cap / s; }

  for (k = this.scares.length - 1; k >= 0; k--) if (--this.scares[k].life <= 0) this.scares.splice(k, 1);

  this.polar = this.polarisation();

  this.histPos = (this.histPos + 1) % this.hist.length;

};

Model.prototype.polarisation = function () {
  var sx = 0, sy = 0, n = this.n;
  if (!n) return 0;
  for (var i = 0; i < n; i++) {
    var s = Math.sqrt(this.vx[i] * this.vx[i] + this.vy[i] * this.vy[i]) || 1;
    sx += this.vx[i] / s; sy += this.vy[i] / s;

Model.prototype._chooseTarget = function (pr) {

    var dx = this.wrapD(this.x[i] - pr.x, this.W), dy = this.wrapD(this.y[i] - pr.y, this.H);
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d > FIX.huntRange) continue;
    var score = d - Math.max(0, 6 - this.nb[i]) * 25;   // isolated fish look closer

Model.prototype._stepPred = function (pr) {
  var W = this.W, H = this.H, sp = FIX.predSpeed, ax = 0, ay = 0, t, cap = sp;
  if (pr.handle > 0) {

// A flat plane carrying a 2D canvas, used for all text in the scene
function makeCanvasPlane(widthM, pxW, pxH) {
  const canvas = document.createElement('canvas');
  canvas.width = pxW; canvas.height = pxH;
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, fog: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(widthM, widthM * pxH / pxW), mat);
  return { canvas, ctx, tex, mesh, mat };
}

  ctx.beginPath();

function wrapLines(ctx, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);

}
// Draws simple HTML (paragraphs <p> and bold <b>) with word wrap; returns the y after the last line
function drawRich(ctx, html, x, y, maxW, size, lineH, col, boldCol) {
  const paras = html.replace(/<span[^>]*><\/span>/g, '').replace(/&rarr;/g, '→').replace(/&times;/g, '×')
    .split(/<\/p>\s*/).map(p => p.replace(/<p>/g, '').trim()).filter(Boolean);
  for (const para of paras) {
    const words = [];
    para.split(/(<b>.*?<\/b>)/).forEach(seg => {
      const bold = seg.startsWith('<b>');
      seg.replace(/<\/?[^>]+>/g, '').split(/\s+/).filter(Boolean).forEach(w => words.push([w, bold]));
    });
    let cx = x;
    for (const [w, bold] of words) {
      ctx.font = `${bold ? '700 ' : ''}${size}px ${FONT}`;
      const ww = ctx.measureText(w + ' ').width;
      if (cx + ctx.measureText(w).width > x + maxW && cx > x) { cx = x; y += lineH; }
      ctx.fillStyle = bold ? boldCol : col; ctx.fillText(w, cx, y);
      cx += ww;

// What the main school is doing, from its polarisation and milling (thresholds as in Couzin et al. 2002)
function schoolState(m) {

// A low-poly fish, nose along +z, with countershading (dark back, pale belly) and coloured fins.
function fishGeometry(len, back, belly, fin) {

  for (let r = 0; r < rings.length - 1; r++) for (let k = 0; k < SEG; k++) {
    const a = vtx(r, k), b = vtx(r, k + 1), c = vtx(r + 1, k), d = vtx(r + 1, k + 1), hm = 0.15 * len;
    push(a, shade(a[1], hm)); push(c, shade(c[1], hm)); push(b, shade(b[1], hm));
    push(b, shade(b[1], hm)); push(c, shade(c[1], hm)); push(d, shade(d[1], hm));
  }
  const L = len, tri = (p, q, r) => { push(p, cF); push(q, cF); push(r, cF); };

  tri([0, 0, -0.34 * L], [0, 0.20 * L, -0.56 * L], [0, 0.03 * L, -0.46 * L]);
  tri([0, 0, -0.34 * L], [0, 0.03 * L, -0.46 * L], [0, -0.03 * L, -0.46 * L]);
  tri([0, 0, -0.34 * L], [0, -0.03 * L, -0.46 * L], [0, -0.20 * L, -0.56 * L]);

  tri([0, 0.13 * L, 0.10 * L], [0, 0.22 * L, -0.06 * L], [0, 0.08 * L, -0.16 * L]);

  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));

}

// Instanced mesh whose tail beats in the vertex shader (one draw call for every fish)
function swimmingMesh(geom, maxCount, len, freq, amp, emissive) {
  const phase = new Float32Array(maxCount);
  for (let i = 0; i < maxCount; i++) phase[i] = Math.random() * 6.283;
  geom.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phase, 1));

  mat.onBeforeCompile = (sh) => {

      .replace('#include <common>', `#include <common>
        attribute float aPhase;
        uniform float uTime;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float tw = clamp((${(0.2 * len).toFixed(4)} - position.z) / ${(0.75 * len).toFixed(4)}, 0.0, 1.0);
        transformed.x += sin(uTime * ${freq.toFixed(2)} + aPhase - position.z * ${(7 / len).toFixed(3)}) * ${(amp * len).toFixed(4)} * tw * tw;`);

    const shaftMat = new THREE.MeshBasicMaterial({ color: '#bfe8ff', transparent: true, opacity: 0.022, depthWrite: false,
                                                  blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
    for (let k = 0; k < 14; k++) {
      const r = 3 + rnd() * 11, a = rnd() * Math.PI * 2, w = 0.25 + rnd() * 0.6;
      const g = new THREE.CylinderGeometry(w * 0.6, w * 1.4, 7, 10, 1, true); g.translate(0, -3.5, 0);
      const sh = new THREE.Mesh(g, shaftMat);
      sh.position.set(Math.cos(a) * r, 6.6, Math.sin(a) * r);
      sh.rotation.z = 0.18; sh.userData.ph = rnd() * 6;
      o.add(sh); this.shafts.push(sh);
    }
    // marine snow: drifting specks that show your own movement through the water
    const N = 2500, pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) { pos[i * 3] = (rnd() - 0.5) * 24; pos[i * 3 + 1] = rnd() * 6.5; pos[i * 3 + 2] = (rnd() - 0.5) * 24; }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const dot = document.createElement('canvas'); dot.width = dot.height = 32;
    const dc = dot.getContext('2d'), gr = dc.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,0.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    dc.fillStyle = gr; dc.fillRect(0, 0, 32, 32);
    this.snow = new THREE.Points(g, new THREE.PointsMaterial({ color: '#d8f0ff', size: 0.02, map: new THREE.CanvasTexture(dot),
                                                               transparent: true, opacity: 0.8, depthWrite: false }));
    o.add(this.snow);
  },
  tick: function (t, dt) {
    const s = t / 1000;
    for (const w of this.weeds) w.rotation.z = 0.15 * Math.sin(s * 0.8 + w.userData.ph);
    for (const sh of this.shafts) sh.rotation.x = 0.06 * Math.sin(s * 0.25 + sh.userData.ph);
    if (!dt) return;
    const p = this.snow.geometry.attributes.position.array, d = Math.min(dt, 100) / 1000;
    for (let i = 0; i < p.length; i += 3) {
      p[i + 1] -= 0.03 * d; p[i] += 0.02 * d;
      if (p[i + 1] < 0) p[i + 1] += 6.5;
      if (p[i] > 12) p[i] -= 24;
    }
    this.snow.geometry.attributes.position.needsUpdate = true;
  }
});

// ===================== PANELS AND CONTROLS =====================
// Each panel belongs to one view (mode-visible). Its controls respond only while that view is on and panels are shown.
function panelActive(el) {
  if (el._modeEl === undefined) el._modeEl = el.closest('[mode-visible]');
  return SIM.panel && (!el._modeEl || el._modeEl.getAttribute('mode-visible').mode === SIM.mode);
}
function setClickable(el, on) {
  if (el._clickable === on) return;
  el._clickable = on;
  if (on) el.classList.add('clickable'); else el.classList.remove('clickable');
}
AFRAME.registerComponent('mode-visible', {
  schema: { mode: { type: 'string', default: 'ocean' } },
  tick: function () { this.el.object3D.visible = SIM.panel && SIM.mode === this.data.mode; }
});

// While dragging with the mouse, stop the camera from rotating; call onUp when released
function holdLook(cursorEl, onUp) {
  const cam = document.querySelector('[camera]');
  const mouse = cursorEl === cursorEl.sceneEl || cursorEl.tagName === 'A-SCENE';
  if (mouse && cam) cam.setAttribute('look-controls', 'enabled', false);
  const up = () => {
    onUp();
    if (mouse && cam) cam.setAttribute('look-controls', 'enabled', true);
    cursorEl.removeEventListener('mouseup', up);
  };
  cursorEl.addEventListener('mouseup', up);
}

// ---------- Draggable slider (works with Quest controllers and a mouse) ----------
// obj: which settings it changes (P = ocean, P2 = tank). scale: factor for the displayed value (e.g. units -> body lengths)
AFRAME.registerComponent('ui-slider', {
  schema: { key: { type: 'string' }, obj: { type: 'string', default: 'P' }, min: { type: 'number' }, max: { type: 'number' },
            step: { type: 'number', default: 1 }, decimals: { type: 'int', default: 0 }, scale: { type: 'number', default: 1 },
            label: { type: 'string' }, unit: { type: 'string', default: '' },
            width: { type: 'number', default: 0.56 }, rule: { type: 'boolean', default: true } },
  init: function () {
    const d = this.data, w = d.width, o = new THREE.Group();
    this.S = d.obj === 'P2' ? P2 : P;
    const basic = (col, opts) => new THREE.MeshBasicMaterial(Object.assign({ color: col, transparent: true, fog: false }, opts || {}));
    this.label = makeCanvasPlane(w, 640, 52);
    this.label.mesh.position.set(0, 0.028, 0.001); o.add(this.label.mesh);

    track.position.set(0, -0.018, 0.001); o.add(track);
    const fg = new THREE.PlaneGeometry(w, 0.012); fg.translate(w / 2, 0, 0);
    this.fill = new THREE.Mesh(fg, basic('#4aa3df')); this.fill.position.set(-w / 2, -0.018, 0.0015); o.add(this.fill);
    this.knobMat = basic('#eef3f8');
    this.knob = new THREE.Mesh(new THREE.CircleGeometry(0.02, 32), this.knobMat);
    this.knob.position.set(0, -0.018, 0.002); o.add(this.knob);
    const hit = new THREE.Mesh(new THREE.PlaneGeometry(w + 0.06, 0.085), basic('#ffffff', { opacity: 0, depthWrite: false }));
    hit.position.set(0, 0.005, 0.0005); o.add(hit);
    this.el.setObject3D('ui', o);
    this.hover = false; this.dragging = false; this.drawn = '';
    this.el.addEventListener('mouseenter', () => { this.hover = true; });
    this.el.addEventListener('mouseleave', () => { this.hover = false; });
    this.el.addEventListener('mousedown', (e) => {
      if (!panelActive(this.el)) return;
      this.cursorEl = e.detail.cursorEl; this.dragging = true;
      this.setFromHit(e.detail.intersection);
      holdLook(this.cursorEl, () => { this.dragging = false; });
    });
  },
  setFromHit: function (hit) {
    if (!hit) return;
    const d = this.data, lp = this.el.object3D.worldToLocal(hit.point.clone());
    const frac = clamp((lp.x + d.width / 2) / d.width, 0, 1);
    let v = Math.round((d.min + frac * (d.max - d.min)) / d.step) * d.step;
    v = clamp(v, d.min, d.max);
    if (v !== this.S[d.key]) {
      this.S[d.key] = v;
      if (d.rule) { if (this.S === P2) SIM2.preset = 'custom'; else SIM.preset = 'custom'; }
    }

  tick: function () {
    const d = this.data, on0 = panelActive(this.el);
    setClickable(this.el, on0);
    if (!on0) { this.dragging = false; return; }
    if (this.dragging && this.cursorEl && this.cursorEl.components.raycaster) {
      this.setFromHit(this.cursorEl.components.raycaster.getIntersection(this.el));
    }
    const v = this.S[d.key], frac = clamp((v - d.min) / (d.max - d.min), 0, 1), on = this.hover || this.dragging;
    this.knob.position.x = -d.width / 2 + frac * d.width;
    this.fill.scale.x = Math.max(frac, 0.0001);
    this.knobMat.color.set(on ? '#ffd166' : '#eef3f8');
    this.knob.scale.setScalar(on ? 1.25 : 1);
    const valTxt = `${(v * d.scale).toFixed(d.decimals)} ${d.unit}`.trim();

      this.drawn = txt;

      c.font = `700 30px ${FONT}`; c.textAlign = 'right'; c.fillText(valTxt, 638, 28);
      this.label.tex.needsUpdate = true;
    }
  }
});

    const grp = new THREE.Group(); grp.add(this.c.mesh);
    this.el.setObject3D('ui', grp);

    this.offset = new THREE.Vector3(); this.tmp = new THREE.Vector3(); this.cam = new THREE.Vector3();
    const t = this.data.target.object3D;
    this.home = { p: t.position.clone(), y: t.rotation.y };
    this.el.sceneEl.addEventListener('reset-poses', () => { t.position.copy(this.home.p); t.rotation.y = this.home.y; });
    this.el.addEventListener('mouseenter', () => { this.hover = true; });
    this.el.addEventListener('mouseleave', () => { this.hover = false; });
    this.el.addEventListener('mousedown', (e) => {
      const hit = e.detail.intersection; if (!hit || !panelActive(this.el)) return;
      this.cursorEl = e.detail.cursorEl; this.dragging = true;
      this.dist = hit.distance;
      const tg = this.data.target.object3D;
      tg.updateMatrixWorld(true);
      this.offset.copy(tg.worldToLocal(hit.point.clone()));
      holdLook(this.cursorEl, () => { this.dragging = false; });
    });
  },
  tick: function () {
    setClickable(this.el, panelActive(this.el));
    if (this.dragging && this.cursorEl && this.cursorEl.components.raycaster) {
      const ray = this.cursorEl.components.raycaster.raycaster.ray;
      const tg = this.data.target.object3D, parent = tg.parent;
      const target = parent.worldToLocal(this.tmp.copy(ray.direction).multiplyScalar(this.dist).add(ray.origin));
      this.el.sceneEl.camera.getWorldPosition(this.cam); parent.worldToLocal(this.cam);
      tg.rotation.y = Math.atan2(this.cam.x - target.x, this.cam.z - target.z);   // keep facing the viewer
      tg.position.copy(target);
      tg.updateMatrix();
      tg.position.sub(this.offset.clone().applyQuaternion(tg.quaternion));
    }
    const key = this.hover + '' + this.dragging;
    if (key === this.drawn) return;
    this.drawn = key;
    const c = this.c.ctx, on = this.hover || this.dragging;
    c.clearRect(0, 0, 768, 80);

// ===================== 2D TANK AND GUIDED TOUR =====================
// The 2D model runs on a table top. Its edges wrap around (periodic boundaries), as in the 2D app.

// ---------- Flat overlay shapes drawn on the table: rings, arrows and labels ----------
function flatRingGeometry(r, w, dashed, fill) {
  const pos = [], N = Math.max(24, Math.round(r * 400));
  const r0 = fill ? 0 : r - w / 2, r1 = fill ? r : r + w / 2;
  for (let k = 0; k < N; k++) {
    if (dashed && k % 2) continue;
    const a0 = k / N * Math.PI * 2, a1 = (k + 1) / N * Math.PI * 2;
    const p = (rr, a) => [Math.cos(a) * rr, 0, Math.sin(a) * rr];
    const A = p(r0, a0), B = p(r1, a0), C = p(r1, a1), D = p(r0, a1);
    pos.push(...A, ...C, ...B, ...A, ...D, ...C);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return g;
}
const _ringCache = new Map();
function ringGeom(r, w, dashed, fill) {
  const key = `${r.toFixed(3)}|${w}|${dashed}|${fill}`;
  if (!_ringCache.has(key)) { if (_ringCache.size > 200) _ringCache.clear(); _ringCache.set(key, flatRingGeometry(r, w, dashed, fill)); }
  return _ringCache.get(key);
}
const flatMat = (col, op) => new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: op === undefined ? 1 : op,
                                                            depthWrite: false, fog: false, side: THREE.DoubleSide });

function Overlay(group) {

  const sh = new THREE.PlaneGeometry(1, 1); sh.rotateX(-Math.PI / 2); sh.translate(0.5, 0, 0);   // unit shaft along +x
  this.shaftG = sh;
  const hd = new THREE.BufferGeometry();
  hd.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, -1, 0, -0.5, -1, 0, 0.5], 3));  // head tip at origin
  this.headG = hd;
}
Overlay.prototype.begin = function () { this.nr = this.na = this.nl = 0; };
Overlay.prototype.end = function () {
  for (let i = this.nr; i < this.rings.length; i++) this.rings[i].visible = false;
  for (let i = this.na; i < this.arrows.length; i++) this.arrows[i].visible = false;
  for (let i = this.nl; i < this.labels.length; i++) this.labels[i].mesh.visible = false;
};
// Ring (or filled disc) centred at (x, z)
Overlay.prototype.ring = function (x, z, r, col, op, opts) {
  opts = opts || {};
  if (this.nr === this.rings.length) { const m = new THREE.Mesh(ringGeom(0.1, 0.004, false, false), flatMat('#fff')); m.renderOrder = 2; this.g.add(m); this.rings.push(m); }

  m.geometry = ringGeom(r, opts.w || 0.005, !!opts.dashed, !!opts.fill);
  m.material.color.set(col); m.material.opacity = op;
  m.position.set(x, opts.y || 0.006, z); m.visible = true;
};
// Arrow from (x, z) along (dx, dz), in metres. head: false for a plain line.
Overlay.prototype.arrow = function (x, z, dx, dz, col, w, opts) {
  opts = opts || {};
  const len = Math.sqrt(dx * dx + dz * dz);
  if (len < 1e-4) return;
  if (this.na === this.arrows.length) {
    const grp = new THREE.Group(), mat = flatMat('#fff');
    const shaft = new THREE.Mesh(this.shaftG, mat), head = new THREE.Mesh(this.headG, mat);
    shaft.renderOrder = head.renderOrder = 3;
    grp.add(shaft); grp.add(head); grp.userData = { shaft, head, mat };
    this.g.add(grp); this.arrows.push(grp);
  }
  const a = this.arrows[this.na++], u = a.userData, head = opts.head !== false;
  const hl = head ? Math.min(len * 0.45, w * 3.2) : 0;
  u.mat.color.set(col); u.mat.opacity = opts.op === undefined ? 1 : opts.op;
  u.shaft.scale.set(Math.max(len - hl * 0.8, 1e-4), 1, w);
  u.head.visible = head; u.head.position.set(len, 0, 0); u.head.scale.set(hl, 1, w * 2.6);
  a.position.set(x, opts.y || 0.045, z);

};
// Text lying flat on the table, readable from the near side. align: 'left' | 'center' | 'right'
Overlay.prototype.label = function (x, z, text, col, align, size) {
  if (this.nl === this.labels.length) {
    const c = makeCanvasPlane(0.48, 512, 64); c.mesh.rotation.x = -Math.PI / 2; c.mesh.renderOrder = 4;
    this.g.add(c.mesh); c.drawn = ''; this.labels.push(c);

    const ctx = c.ctx; ctx.clearRect(0, 0, 512, 64);
    ctx.font = `600 36px ${FONT}`; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 8;
    ctx.fillStyle = col || COL.ink;
    const w = ctx.measureText(text).width;
    c.textW = w / 512 * 0.48;
    ctx.textAlign = 'left'; ctx.fillText(text, 4, 34);

  c.mesh.position.set(x + (off + 0.24) * (size || 1), 0.05, z);

// ---------- Guided tour: content and state (ported from the 2D app) ----------
const TOUR_FISH = [
  [0, 0, -70],
  [6, 12, -40], [-36, 4, -30], [-26, 26, -20], [-30, -24, -35], [-10, 40, -25],
  [70, -45, 100], [-82, -42, 10], [40, 76, 170]
];
const FORCE_LEN = 27;     // drawn length (world units) of a force of size 1
const KV = 9;             // drawn length (world units) per unit of velocity (units/step)
function tourBuild() {
  const m = new Flat.Model(1000, 1000, P2), t = SIM2.tour;
  TOUR_FISH.forEach(f => {
    const a = f[2] * Math.PI / 180;
    m.addFish(500 + f[0], 500 + f[1], Math.cos(a) * Flat.FIX.maxSpeed, Math.sin(a) * Flat.FIX.maxSpeed);
  });
  m.buildGrid();
  t.model = m; t.cx = 500; t.cy = 500; t.playing = false; t.drag = -1;
}
function tourForces(i) {
  const m = SIM2.tour.model, o = { list: [], sepList: [] };
  m.buildGrid(); m.accel(i, o);
  return o;
}
function tourStepInfo() {
  const m = SIM2.tour.model, o = tourForces(0), vx = m.vx[0], vy = m.vy[0];
  const a0 = Math.atan2(vy, vx), a1 = Math.atan2(vy + o.accY, vx + o.accX);
  let da = (a1 - a0) * 180 / Math.PI; if (da > 180) da -= 360; if (da < -180) da += 360;
  const push = Math.sqrt(o.pushX * o.pushX + o.pushY * o.pushY);
  return { turn: Math.abs(da), capped: push > Flat.FIX.maxForce };
}
function tourGo(i, fresh) {
  const t = SIM2.tour;
  if (i < 0) return;
  if (i >= STEPS.length) { t.playing = false; setMode('tank'); return; }
  if (fresh || !t.model || (i < 7 && t.model.t > 0) || (i === 7 && t.step !== 7)) tourBuild();
  if (t.step === 7 && i !== 7) t.playing = false;
  t.step = i;
}
const fmt = v => (Math.round(v * 10) / 10).toString();
const pct = v => Math.round(v * 100) + '%';
const STEPS = [
  { title: 'Meet the school',
    text: () => '<p>Real fish schools have no leader. Each fish follows a few simple rules using only what it can sense nearby, and the school <b>emerges</b> from those rules.</p><p>We’ll follow one fish <b>(pink)</b> through a single time step of the model. The tank has been zoomed in around it.</p>' },
  { title: 'What each fish senses',
    text: o => '<p>Two distances matter.</p><p>The <b>perception radius</b> (dashed circle, ' + fmt(P2.R / BL2) + ' body lengths): fish inside it are <b>neighbours</b> (ringed), and they are the only fish it pays attention to. Here there ' + (o.n === 1 ? 'is <b>1 neighbour</b>' : 'are <b>' + o.n + ' neighbours</b>') + '.</p><p>The <b>personal space</b> (red circle, ' + fmt(Math.min(P2.Rsep, P2.R) / BL2) + ' body lengths): neighbours inside it are too close. Here there ' + (o.ns === 1 ? 'is <b>1</b>' : 'are <b>' + o.ns + '</b>') + '.</p>' },
  { title: 'Rule 1: Separation',
    text: o => o.ns > 0
      ? '<p>Each neighbour inside personal space pushes the fish <b>directly away from it</b> (red arrow). The push is zero at the edge of personal space and grows as the neighbour gets closer' + (o.ns > 1 ? '; pushes from several neighbours add up' : '') + '.</p><p>Drag the intruding fish closer or further away and watch the arrow change.</p>'
      : '<p>No neighbour is inside personal space, so there is <b>no separation push</b> this step. Drag a fish into the red circle to see one appear.</p>' },
  { title: 'Rule 2: Alignment',
    text: o => o.n > 0
      ? '<p>The fish compares its own velocity (grey) with the <b>average velocity of its neighbours</b> (faint blue). The alignment push (blue arrow) is the <b>difference</b> between the two (thin line).</p><p>It is zero if the fish already swims like its neighbours, and larger the more out of step it is.</p>'
      : '<p>No neighbours, so nothing to align with.</p>' },
  { title: 'Rule 3: Cohesion',
    text: o => o.n > 0
      ? '<p>The fish is pulled <b>straight towards the centre of its neighbours</b> (green ⊕, green arrow).</p><p>The pull grows with distance: zero at the centre, and strongest when the centre is a full perception radius away. Here it is ' + pct(Math.sqrt(o.cohX * o.cohX + o.cohY * o.cohY)) + ' of that maximum.</p>'
      : '<p>No neighbours, so no pull towards a group.</p>' },
  { title: 'The overall push',
    text: () => '<p>At each step the fish is pushed by these three forces. Each is multiplied by a <b>weight</b>, and adding them tip to tail gives the <b>overall push</b> (white):</p><p><b>' + fmt(P2.sep) + '</b> × separation + <b>' + fmt(P2.ali) + '</b> × alignment + <b>' + fmt(P2.coh) + '</b> × cohesion</p><p>The <b>sizes</b> of the forces come from where the neighbours are, and change every step. The <b>weights</b> (the sliders below) are fixed traits shared by all fish: how much they care about each rule. Changing the weights is how you get different kinds of collective behaviour. Try it now.</p>' },
  { title: 'Turning, gradually',
    text: (o, extra) => '<p>The overall push changes the fish’s velocity. The change per step is capped' + (extra.capped ? ' (the cap is active right now)' : '') + ', which acts like inertia, and the fish also drifts back towards its cruising speed.</p><p>So in one step its heading changes by only <b>' + extra.turn.toFixed(1) + '°</b>. The change is drawn 10× larger than reality so you can see it. This is why schools turn smoothly.</p>' },
  { title: 'Everyone at once',
    text: () => '<p>Every fish does the same calculation from the <b>same snapshot</b>, then they all move together. The arrows show each fish’s overall push. (If fish moved one at a time, later fish would react to where others had already gone.)</p><p>Press <b>Play the group</b> to run this small group for a few seconds.</p>' },
  { title: 'Now scale it up',
    text: () => '<p>The tank applies exactly these rules to about a hundred fish. Its edges wrap around: a fish leaving one side comes back on the other, so there are no walls to complicate things.</p><p>Watch the <b>polarisation</b> plot: it measures how aligned the school is, from 0 (random headings) to 1 (everyone swimming the same way). Then try the presets, or go back to the 3D ocean to see the same rules all around you.</p>' }
];
const DRAG_STEPS = { 1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 6: 1 };

// Tour zoom (metres per world unit): the perception circle fills most of the table's depth
function tourScale() { return TANK.d * 0.95 / (P2.R * 2 * 1.35); }

// ---------- The tank: table, fish, overlays, stepping ----------
AFRAME.registerComponent('tank-view', {
  init: function () {
    const o = this.el.object3D;
    // table and water
    const table = new THREE.Mesh(new THREE.BoxGeometry(TANK.w + 0.12, 0.78, TANK.d + 0.12), new THREE.MeshLambertMaterial({ color: '#1d2b36' }));
    table.position.y = -0.4; o.add(table);
    const wc = document.createElement('canvas'); wc.width = 8; wc.height = 256;
    const wx = wc.getContext('2d'), gr = wx.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#16506e'); gr.addColorStop(1, '#0a2433'); wx.fillStyle = gr; wx.fillRect(0, 0, 8, 256);
    const wtex = new THREE.CanvasTexture(wc); wtex.colorSpace = THREE.SRGBColorSpace;
    const water = new THREE.Mesh(new THREE.PlaneGeometry(TANK.w, TANK.d), new THREE.MeshBasicMaterial({ map: wtex, fog: false }));
    water.rotation.x = -Math.PI / 2; water.position.y = 0.002; o.add(water);
    const rimMat = new THREE.MeshBasicMaterial({ color: '#2f7fb8', fog: false });
    [[TANK.w + 0.12, 0, TANK.d / 2 + 0.03, 0.06], [TANK.w + 0.12, 0, -TANK.d / 2 - 0.03, 0.06]].forEach(r => {
      const b = new THREE.Mesh(new THREE.BoxGeometry(r[0], 0.03, r[3]), rimMat); b.position.set(r[1], 0.0, r[2]); o.add(b); });
    [[TANK.w / 2 + 0.03], [-TANK.w / 2 - 0.03]].forEach(r => {
      const b = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.03, TANK.d), rimMat); b.position.set(r[0], 0.0, 0); o.add(b); });
    // fish and predators (geometry of unit length, scaled per instance)
    const fish = swimmingMesh(fishGeometry(1, ...FISH2_COLS), 512, 1, 14, 0.10, '#202020');
    this.fish = fish.mesh; this.fishT = fish.uTime;
    this.fish.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(512 * 3).fill(1), 3);
    this.fish.instanceColor.setUsage(THREE.DynamicDrawUsage);
    const pred = swimmingMesh(fishGeometry(1, ...PRED_COLS), 4, 1, 6, 0.12, '#3a1406');
    this.pred = pred.mesh; this.predT = pred.uTime;
    o.add(this.fish); o.add(this.pred);
    this.ov = new Overlay(o);
    this.clock = 0; this.scareT = 0;
    this.tmp = new THREE.Vector3();
  },
  tick: function (t, dt) {
    const show = SIM.mode === 'tank' || SIM.mode === 'tour';
    this.el.object3D.visible = show;
    if (!show || !dt) return;
    const s = Math.min(dt, 100) / 1000;
    if (SIM.mode === 'tank') this.runTank(s); else this.runTour(s);
  },

  // ----- free-running 2D simulation -----
  runTank: function (s) {
    const m = SIM2.model;
    if (m.n !== P2.n) m.setCount(P2.n);
    if (m.preds.length !== P2.preds) m.setPredators(P2.preds);
    this.handScare(m);
    if (!P2.paused) {
      SIM2.acc += s * 60 * P2.speed;
      let k = 0;
      while (SIM2.acc >= 1 && k < 6) {
        SIM2.px.set(m.x.subarray(0, m.n)); SIM2.py.set(m.y.subarray(0, m.n));
        m.step(); SIM2.acc -= 1; k++;
      }
      if (k === 6) SIM2.acc = 0;
      this.clock += s * P2.speed;
    }
    const a = P2.paused ? 1 : clamp(SIM2.acc, 0, 1);
    const k = TANK.w / TANK.W, cx = TANK.W / 2, cy = TANK.H / 2, sc = BL2 * k * 1.6;
    const arr = this.fish.instanceMatrix.array, col = this.fish.instanceColor.array;
    for (let i = 0; i < m.n; i++) {
      let x = m.x[i], y = m.y[i];
      const qx = SIM2.px[i], qy = SIM2.py[i];
      if (Math.abs(x - qx) < TANK.W / 2 && Math.abs(y - qy) < TANK.H / 2) { x = qx + (x - qx) * a; y = qy + (y - qy) * a; }

      const f = m.fear[i], b = 1 + 0.6 * f;
      col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = b;
    }
    this.fish.count = m.n;
    this.fish.instanceMatrix.needsUpdate = true; this.fish.instanceColor.needsUpdate = true;
    const pa = this.pred.instanceMatrix.array;
    m.preds.forEach((p, j) => writePose(pa, j, (p.x - cx) * k, 0.05, (p.y - cy) * k, p.vx, 0, p.vy, sc * 2.4));
    this.pred.count = m.preds.length; this.pred.instanceMatrix.needsUpdate = true;
    this.fishT.value = this.predT.value = this.clock;
    // startle ripples
    this.ov.begin();
    for (const sc2 of m.scares) {
      const life = sc2.life / Flat.FIX.scareLife;
      this.ov.ring((sc2.x - cx) * k, (sc2.y - cy) * k, (1 - life) * Flat.FIX.fearR * k, '#ffffff', 0.6 * life, { w: 0.006 });
    }
    this.ov.end();
  },
  // A gripping hand held over the tank startles the fish beneath it
  handScare: function (m) {
    if (++this.scareT % 12) return;
    const k = TANK.w / TANK.W;
    for (const h of SIM.hands) {
      if (!h.on || !h.el) continue;
      h.el.object3D.getWorldPosition(this.tmp); this.el.object3D.worldToLocal(this.tmp);
      if (Math.abs(this.tmp.x) < TANK.w / 2 && Math.abs(this.tmp.z) < TANK.d / 2 && this.tmp.y < 0.5 && this.tmp.y > -0.1)
        m.scare(this.tmp.x / k + TANK.W / 2, this.tmp.z / k + TANK.H / 2);
    }
  },

  // ----- guided tour: a small zoomed-in group around one pink fish -----
  runTour: function (s) {
    const tr = SIM2.tour, m = tr.model;
    if (!m) return;
    if (tr.playing) {
      tr.acc = (tr.acc || 0) + s * 60;
      while (tr.acc >= 1) {
        m.step(); tr.acc -= 1;
        tr.cx += (m.x[0] - tr.cx) * 0.08; tr.cy += (m.y[0] - tr.cy) * 0.08;
        if (--tr.playLeft <= 0) { tr.playing = false; tr.acc = 0; break; }

    }
    const k = tourScale(), step = tr.step, ov = this.ov;
    const T = (x, y) => [(x - tr.cx) * k, (y - tr.cy) * k];
    const inside = (X, Z) => Math.abs(X) < TANK.w / 2 - 0.03 && Math.abs(Z) < TANK.d / 2 - 0.03;
    const o = tourForces(0), nb = {};
    o.list.forEach(j => { nb[j] = 1; });
    const sc = BL2 * k * 1.25, arr = this.fish.instanceMatrix.array, col = this.fish.instanceColor.array;
    for (let i = 0; i < m.n; i++) {
      const [X, Z] = T(m.x[i], m.y[i]);
      if (!inside(X, Z)) { hidePose(arr, i); continue; }
      writePose(arr, i, X, 0.035, Z, m.vx[i], 0, m.vy[i], sc * (i === 0 ? 1.15 : 1));
      const dim = step >= 1 && step <= 6 && !nb[i] && !tr.playing && i !== 0;
      if (i === 0) { col[0] = 2.2; col[1] = 0.9; col[2] = 1.7; }
      else { const b = dim ? 0.3 : 1; col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = b; }
    }
    this.fish.count = m.n;
    this.fish.instanceMatrix.needsUpdate = true; this.fish.instanceColor.needsUpdate = true;
    this.pred.count = 0;
    this.fishT.value = this.clock;

    ov.begin();
    const [fx, fz] = T(m.x[0], m.y[0]), Rs = Math.min(P2.Rsep, P2.R);
    ov.ring(fx, fz, sc * 0.62, COL.focal, 0.9, { w: 0.006, y: 0.006 });
    if (!tr.playing) {
      if (step >= 1 && step <= 5) {
        ov.ring(fx, fz, P2.R * k, COL.ink, 0.7, { dashed: true, w: 0.006 });
        ov.ring(fx, fz, P2.R * k, COL.ink, 0.05, { fill: true, y: 0.003 });
        ov.ring(fx, fz, Rs * k, COL.sep, 0.9, { w: 0.006 });
        ov.ring(fx, fz, Rs * k, COL.sep, 0.08, { fill: true, y: 0.0035 });
        o.list.forEach(j => { const [X, Z] = T(m.x[j], m.y[j]); ov.ring(X, Z, sc * 0.75, COL.ink, 0.6, { w: 0.004 }); });
        if (step === 1) {
          ov.label(fx, fz - P2.R * k - 0.035, 'perception radius', COL.ink, 'center');
          ov.label(fx, fz - Rs * k - 0.03, 'personal space', COL.sep, 'center');
        }
      }
      const W3 = 0.011, W1 = 0.005;
      const tip = (x, z, dx, dz, text, c, side) => {
        const L = Math.sqrt(dx * dx + dz * dz) || 1, px = -dz / L, pz = dx / L, sd = side || 0;
        ov.label(x + dx + dx / L * 0.03 + px * sd * 0.035, z + dz + dz / L * 0.03 + pz * sd * 0.035 + 0.01, text, c, dx >= 0 ? 'left' : 'right', 0.85);
      };

      if (step === 2) {
        o.sepList.forEach(j => { const [X, Z] = T(m.x[j], m.y[j]); ov.arrow(fx, fz, X - fx, Z - fz, COL.sep, W1 * 0.8, { head: false, op: 0.6 }); });
        ov.arrow(fx, fz, sepV[0], sepV[1], COL.sep, W3);
        if (o.ns) tip(fx, fz, sepV[0], sepV[1], 'separation', COL.sep);
      }
      if (step === 3 && o.n) {
        o.list.forEach(j => { const [X, Z] = T(m.x[j], m.y[j]); ov.arrow(X, Z, m.vx[j] * V * 0.6, m.vy[j] * V * 0.6, COL.ink, W1, { op: 0.45 }); });
        const v0 = [m.vx[0] * V, m.vy[0] * V], av = [o.avx * V, o.avy * V];
        ov.arrow(fx, fz, v0[0], v0[1], '#b8c4cc', W1 * 1.4);
        ov.arrow(fx, fz, av[0], av[1], COL.ali, W1 * 1.4, { op: 0.55 });
        ov.arrow(fx + v0[0], fz + v0[1], av[0] - v0[0], av[1] - v0[1], COL.ali, W1 * 0.7, { head: false, op: 0.8 });
        ov.arrow(fx, fz, aliV[0], aliV[1], COL.ali, W3);
        tip(fx, fz, aliV[0], aliV[1], 'alignment', COL.ali);
        const crs = v0[0] * av[1] - v0[1] * av[0], sd = crs >= 0 ? 1 : -1;
        tip(fx, fz, v0[0], v0[1], 'own velocity', '#b8c4cc', -sd);
        tip(fx, fz, av[0], av[1], 'neighbours’ average', COL.ali, sd);
      }
      if (step === 4 && o.n) {
        const cp = [fx + o.cx * k, fz + o.cy * k];
        ov.arrow(fx, fz, cp[0] - fx, cp[1] - fz, COL.coh, W1 * 0.8, { head: false, op: 0.7 });
        ov.ring(cp[0], cp[1], 0.018, COL.coh, 1, { w: 0.005, y: 0.045 });
        ov.arrow(cp[0] - 0.018, cp[1], 0.036, 0, COL.coh, 0.004, { head: false });
        ov.arrow(cp[0], cp[1] - 0.018, 0, 0.036, COL.coh, 0.004, { head: false });
        const offL = Math.sqrt(o.cx * o.cx + o.cy * o.cy) || 1;
        ov.label(cp[0] + o.cx / offL * 0.04, cp[1] + o.cy / offL * 0.04 + 0.01, 'centre of neighbours', COL.coh, o.cx >= 0 ? 'left' : 'right', 0.85);
        ov.arrow(fx, fz, cohV[0], cohV[1], COL.coh, W3);
        tip(fx, fz, cohV[0], cohV[1], 'cohesion', COL.coh, cohV[0] >= 0 ? -1 : 1);
      }
      if (step === 5) {
        const a1 = [sepV[0] * P2.sep, sepV[1] * P2.sep], a2 = [aliV[0] * P2.ali, aliV[1] * P2.ali], a3 = [cohV[0] * P2.coh, cohV[1] * P2.coh];
        const tx = a1[0] + a2[0] + a3[0], tz = a1[1] + a2[1] + a3[1];
        ov.arrow(fx, fz, tx, tz, '#ffffff', W3 * 1.1, { op: 0.9, y: 0.042 });
        ov.arrow(fx, fz, a1[0], a1[1], COL.sep, W3 * 0.8, { y: 0.048 });
        ov.arrow(fx + a1[0], fz + a1[1], a2[0], a2[1], COL.ali, W3 * 0.8, { y: 0.048 });
        ov.arrow(fx + a1[0] + a2[0], fz + a1[1] + a2[1], a3[0], a3[1], COL.coh, W3 * 0.8, { y: 0.048 });
        tip(fx, fz, tx, tz, 'overall push', '#ffffff');
      }
      if (step === 6) {
        const vx = m.vx[0], vy = m.vy[0], nvx = vx + o.accX, nvy = vy + o.accY, V6 = V * 1.6;
        const side = vx * o.accY - vy * o.accX >= 0 ? 1 : -1;
        ov.arrow(fx, fz, vx * V6, vy * V6, '#b8c4cc', W1 * 1.6);
        tip(fx, fz, vx * V6, vy * V6, 'current velocity', '#b8c4cc', -side);
        ov.arrow(fx, fz, nvx * V6, nvy * V6, COL.focal, W1 * 1.6, { op: 0.7 });
        ov.arrow(fx + vx * V6, fz + vy * V6, o.accX * V6 * 10, o.accY * V6 * 10, '#ffffff', W3);
        tip(fx + vx * V6, fz + vy * V6, o.accX * V6 * 10, o.accY * V6 * 10, 'change ×10', '#ffffff');
        tip(fx, fz, vx * V6 * 0.6, vy * V6 * 0.6, 'new velocity (faint pink)', COL.focal, side);
      }
      if (step === 7) {
        const oo = { list: null, sepList: null };
        for (let i = 0; i < m.n; i++) {
          m.accel(i, oo);
          const [X, Z] = T(m.x[i], m.y[i]);
          if (!inside(X, Z)) continue;
          const gx = (P2.sep * oo.sepX + P2.ali * oo.aliX + P2.coh * oo.cohX) * F * 0.6;
          const gz = (P2.sep * oo.sepY + P2.ali * oo.aliY + P2.coh * oo.cohY) * F * 0.6;
          ov.arrow(X, Z, gx, gz, '#ffffff', W1 * 1.6);
        }
      }
    }
    ov.end();
  },
  // tank coordinates (metres, local) -> model world units, for the view currently shown
  toWorld: function (X, Z) {
    if (SIM.mode === 'tank') { const k = TANK.w / TANK.W; return [X / k + TANK.W / 2, Z / k + TANK.H / 2]; }
    const tr = SIM2.tour, k = tourScale();
    return [X / k + tr.cx, Z / k + tr.cy];
  }
});

// Invisible surface over the tank that the controller rays hit: click to startle (tank), drag fish (tour)
AFRAME.registerComponent('tank-hit', {
  init: function () {
    const g = new THREE.PlaneGeometry(TANK.w, TANK.d); g.rotateX(-Math.PI / 2);
    this.el.setObject3D('mesh', new THREE.Mesh(g, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })));
    this.view = () => this.el.parentNode.components['tank-view'];
    this.el.addEventListener('mousedown', (e) => {
      const hit = e.detail.intersection; if (!hit) return;
      const lp = this.el.object3D.worldToLocal(hit.point.clone()), w = this.view().toWorld(lp.x, lp.z);
      if (SIM.mode === 'tank') { SIM2.model.scare(w[0], w[1]); return; }
      const tr = SIM2.tour;
      if (SIM.mode !== 'tour' || !DRAG_STEPS[tr.step] || tr.playing) return;
      let best = -1, bd = (BL2 * 2.5) ** 2;
      for (let i = 0; i < tr.model.n; i++) { const d2 = (tr.model.x[i] - w[0]) ** 2 + (tr.model.y[i] - w[1]) ** 2; if (d2 < bd) { bd = d2; best = i; } }
      if (best < 0) return;
      tr.drag = best; this.cursorEl = e.detail.cursorEl;
      holdLook(this.cursorEl, () => { tr.drag = -1; });
    });
  },
  tick: function () {
    setClickable(this.el, SIM.mode === 'tank' || SIM.mode === 'tour');
    const tr = SIM2.tour;
    if (SIM.mode !== 'tour' || tr.drag < 0 || !this.cursorEl || !this.cursorEl.components.raycaster) return;
    const hit = this.cursorEl.components.raycaster.getIntersection(this.el); if (!hit) return;
    const lp = this.el.object3D.worldToLocal(hit.point.clone()), w = this.view().toWorld(lp.x, lp.z);
    tr.model.x[tr.drag] = w[0]; tr.model.y[tr.drag] = w[1];
  }
});

// ---------- Readout for the tank: preset, polarisation and its history ----------
AFRAME.registerComponent('tank-info', {
  init: function () { this.c = makeCanvasPlane(0.72, 1024, 1200); this.el.object3D.add(this.c.mesh); this.last = 0; },
  tick: function (t) {
    if (!SIM.panel || SIM.mode !== 'tank' || t - this.last < 150) return;
    this.last = t;
    const c = this.c.ctx, m = SIM2.model, W = 1024, H = 1200;
    c.clearRect(0, 0, W, H);
    c.fillStyle = COL.panel; roundRect(c, 0, 0, W, H, 28); c.fill();
    c.textBaseline = 'alphabetic'; c.textAlign = 'left';
    c.fillStyle = COL.muted; c.font = `700 28px ${FONT}`; c.fillText('FISH SCHOOL · 2D TANK', 40, 58);
    const pr = PRESETS2[SIM2.preset];
    c.fillStyle = COL.text; c.font = `700 44px ${FONT}`; c.fillText(pr ? pr.name : 'Custom settings', 40, 118);
    c.fillStyle = '#b9c7da'; c.font = `27px ${FONT}`;
    wrapLines(c, pr ? pr.text : 'You have changed the rules. Watch how the school responds, then try a preset to compare.', 944).slice(0, 3)
      .forEach((ln, k) => c.fillText(ln, 40, 164 + k * 36));
    c.fillStyle = COL.muted; c.font = `28px ${FONT}`; c.fillText('Polarisation  (0 = random headings, 1 = all aligned)', 40, 312);
    c.fillStyle = COL.P; c.font = `700 96px ${FONT}`; c.fillText(m.polar.toFixed(2), 40, 410);
    // history (last 900 steps, 15 s)
    const px0 = 70, px1 = 984, py0 = 470, py1 = 720;
    c.strokeStyle = 'rgba(143,163,191,0.25)'; c.lineWidth = 1; c.textAlign = 'right'; c.font = `20px ${FONT}`;
    for (const v of [0, 0.5, 1]) { const y = py1 - v * (py1 - py0); c.beginPath(); c.moveTo(px0, y); c.lineTo(px1, y); c.stroke(); c.fillStyle = COL.muted; c.fillText(v.toFixed(1), px0 - 10, y + 7); }
    c.textAlign = 'left'; c.fillStyle = COL.muted; c.fillText('last 900 steps (15 s)', px0, py1 + 34);
    const N = m.hist.length, L = m.histLen;
    c.strokeStyle = COL.P; c.lineWidth = 4; c.beginPath();
    for (let j = 0; j < L; j++) {
      const v = m.hist[(m.histPos - L + j + N) % N], x = px0 + (px1 - px0) * (j + N - L) / (N - 1), y = py1 - v * (py1 - py0);
      if (j) c.lineTo(x, y); else c.moveTo(x, y);
    }
    c.stroke();
    let y = 820;
    if (m.preds.length) { c.fillStyle = COL.pred; c.font = `600 30px ${FONT}`; c.fillText(`Fish caught: ${m.catches}`, 40, y); y += 50; }
    c.fillStyle = '#b9c7da'; c.font = `26px ${FONT}`;
    ['Point at the tank and pull the trigger to startle the fish,', 'or squeeze a grip with your hand over the water.',
     'The edges wrap around: there are no walls.', 'Explain the rules opens a step-by-step tour.'].forEach(s => { c.fillText(s, 40, y); y += 38; });
    this.c.tex.needsUpdate = true;
  }
});

// ---------- Tour text ----------
AFRAME.registerComponent('explain-display', {
  init: function () { this.c = makeCanvasPlane(1.24, 1024, 600); this.el.object3D.add(this.c.mesh); this.last = 0; },
  tick: function (t) {
    if (!SIM.panel || SIM.mode !== 'tour' || t - this.last < 120) return;
    this.last = t;
    const tr = SIM2.tour, st = STEPS[tr.step], c = this.c.ctx, W = 1024, H = 600;
    c.clearRect(0, 0, W, H);
    c.fillStyle = COL.panel; roundRect(c, 0, 0, W, H, 28); c.fill();
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    for (let i = 0; i < STEPS.length; i++) {
      c.fillStyle = i === tr.step ? '#ffd166' : i < tr.step ? '#4aa3df' : '#2b3a4f';
      c.beginPath(); c.arc(44 + i * 30, 44, 9, 0, 2 * Math.PI); c.fill();
    }
    c.fillStyle = COL.muted; c.font = `600 24px ${FONT}`;
    c.fillText(`STEP ${tr.step + 1} OF ${STEPS.length}`, 44 + STEPS.length * 30 + 16, 53);
    c.fillStyle = COL.text; c.font = `700 48px ${FONT}`; c.fillText(st.title, 40, 120);
    const y = drawRich(c, st.text(tourForces(0), tourStepInfo()), 40, 172, 944, 29, 39, '#d5deea', '#ffffff');
    if (DRAG_STEPS[tr.step]) {
      c.fillStyle = COL.muted; c.font = `italic 25px ${FONT}`;
      c.fillText('Tip: point at any fish and hold the trigger to drag it. Everything updates at once.', 40, Math.min(H - 24, Math.max(y, 520)));
    }
    this.c.tex.needsUpdate = true;
  }
});

  <body>

      2D flocking app. Three views:
        3D ocean  - the school swims all around you (default)
        2D tank   - the original 2D model on a table, edges wrapping around
        Tour      - a step-by-step explainer of the rules, in the tank
      Desktop: drag to look around, WASD to move, click buttons and drag sliders, H hides the panel.
      Quest: open in the browser and press the VR button. Point with either controller and pull the trigger to
      use the panel; squeeze a grip button to scare fish with your hand; B or Y hides the panel.
    -->

          <a-entity ui-slider="obj: P2; key: ali; min: 0; max: 3; step: 0.1; decimals: 1; label: Alignment" position="0.36 0.345 0.002"></a-entity>
          <a-entity ui-slider="obj: P2; key: coh; min: 0; max: 3; step: 0.1; decimals: 1; label: Cohesion" position="0.36 0.270 0.002"></a-entity>
          <a-entity ui-slider="obj: P2; key: R; min: 16; max: 160; step: 4; decimals: 1; scale: 0.125; label: Perception radius; unit: BL" position="0.36 0.195 0.002"></a-entity>

        <!-- Tour panel -->
        <a-entity id="explainer" mode-visible="mode: tour" position="1.3 1.2 -0.6" rotation="-22 -60 0">
